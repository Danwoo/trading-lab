name: CodeQL

# CodeQL 을 **워크플로로** 돌린다 (2026-08-25 — default setup 을 껐다).
#
# ── 왜 옮겼나 ────────────────────────────────────────────────────────────
# default setup 은 설정이 `weekly` 인데도 **PR·push 마다** 분석을 돌렸다 (12일 표본에서 run 의
# 12.9%, GitHub-hosted 1,908분). 그 분석이 PR 을 막지도 않는다 — 경보는 Security 탭의
# alerts 로 나가고 체크는 12일 내내 실패 0이었다. private 로 가면 그 분만 청구된다.
# 워크플로로 옮기면 **언제 도는지를 우리가 정한다**: main 에 들어온 코드와 주 1회 전수.
#
# ── 언어 5종 → 3종 ──────────────────────────────────────────────────────
# default setup 의 `javascript`·`typescript`·`javascript-typescript` 는 GitHub 이 하나로 접어
# 실제로는 3잡이 돌았다. 표기만 정직하게 줄인다 — 분석 범위는 그대로다.
#
# ⚠ **PR 에서는 안 돈다.** 그 대가는 「main 에 들어간 뒤에야 경보가 뜬다」이고, 받아들이는
# 근거는 위 실측이다(12일간 이 체크가 PR 을 막은 적이 없다). 되돌리려면 아래 `on:` 에
# `pull_request:` 를 더하면 된다.
#
# ── private 전환 대비 (2026-09-14) ───────────────────────────────────────
# private 에서 코드 스캐닝 **업로드**는 Code Security 라이선스를 요구한다
# (GitHub 문서: *"If you want to use code scanning on private repositories, you need a
# GitHub Code Security license."*). 결제하지 않기로 했으므로(리드 결정 2026-08-29) 업로드를
# 빼고 **분석 결과를 이 잡이 직접 읽어 판정**한다. 탐지는 그대로 남고, 종전과 달리 결과가
# 실제로 잡을 빨갛게 만든다 — 끄는 것이 아니라 자리를 옮기는 것이다.
on:
  push:
    branches: [main]
  schedule:
    # 주 1회 전수 — default setup 의 `weekly` 를 그대로 옮긴 것이다.
    - cron: "23 19 * * 0"
  workflow_dispatch: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  analyze:
    name: "CodeQL: ${{ matrix.language }}"
    # **주기별로 러너가 갈린다.**
    #   · `schedule`(주 1회) → 언제나 GitHub-hosted. 이 레포의 self-hosted 러너는 WSL 위라
    #     호스트가 자면 얼어 있는데, 보안 스캔이 그렇게 조용히 멎으면 안 된다. 주 1회 × 3잡이라
    #     hosted 비용은 월 15분 안쪽이다 — 이 한 줄이 보증이다.
    #   · 그 밖(`push: main`·수동) → `CI_RUNNER`. main push 는 실측 하루 14회라(2026-08-13~25
    #     100커밋/7일) hosted 로 두면 3잡 × 1분 올림 = 월 1,200분대가 되어 무료 한도의 60% 를
    #     먹는다. 잦은 쪽을 self-hosted 로 보내고, 얼어서 놓친 것은 주 1회 hosted 가 줍는다.
    runs-on: ${{ github.event_name == 'schedule' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      # 업로드하지 않으므로 `security-events: write` 가 필요 없다 — 권한은 쓰는 만큼만.
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # default setup 과 같은 설정을 그대로 옮긴다 — `query_suite: default` 이므로
          # `queries:` 를 안 준다(주면 default 가 아니라 그 묶음이 된다), `threat_model: remote`
          # 는 config 로 옮긴다. 실측 원문:
          #   {"state":"configured","query_suite":"default","threat_model":"remote","schedule":"weekly"}
          config: |
            threat-models: remote

      # **업로드하지 않고 분석한다.** private 에서 코드 스캐닝 업로드는 Code Security 라이선스를
      # 요구하는데 결제하지 않기로 했다(리드 결정 2026-08-29). 그렇다고 분석을 끄면 탐지가
      # 통째로 사라지므로, 라이선스가 필요한 **업로드**만 빼고 결과를 파일로 받는다.
      #
      # 그리고 그 결과를 **이 잡이 직접 읽어 빨갛게 만든다** — 종전에는 경보가 Security 탭으로만
      # 가고 이 체크는 12일 내내 실패 0이었다. 즉 private 전환이 탐지를 약하게 만드는 것이 아니라
      # 오히려 잡이 결과를 책임지게 된다.
      - name: Analyze (업로드 없이 — SARIF 를 파일로)
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: ${{ runner.temp }}/codeql-results
          upload-database: false

      - name: 결과 판정 (fail-closed — SARIF 를 못 읽으면 실패)
        if: ${{ !cancelled() }}
        env:
          RESULTS_DIR: ${{ runner.temp }}/codeql-results
          LANGUAGE: ${{ matrix.language }}
        run: python3 scripts/judge_codeql_sarif.py --dir "$RESULTS_DIR" --language "$LANGUAGE"
