name: CI

# 이 레포의 **코드 검증 전부**가 여기 있다 — 빌드·테스트·정적 스캔·시크릿 스캔.
# 리뷰 배정·판정 게시·머지 판정은 여기 없다 (cross-review.yml 소관).
#
# ── 왜 워크플로 하나에 잡 셋인가 (2026-08-25 통합) ─────────────────────────
# 종전엔 ci.yml 8잡 · frontend-ci.yml 3잡 · repo-scans.yml 6잡 = 17잡이었다. 잡마다
# checkout + 툴체인 설치를 다시 하고, **잡 하나당 1분이 올림 청구된다** — private 로 가면
# 그 바닥값이 과금의 몸통이 된다(12일 표본에서 잡 껍데기만 3,786분). 검사는 하나도 안 줄이고
# 껍데기만 벗긴다: `test: backend` · `test: frontend` · `test: repo` 셋.
#
# **fail-fast 가림은 종전 그대로 없다** — 스텝마다 `!cancelled()` 라 앞 스텝이 실패해도 뒤가
# 전부 돈다. 무엇이 깨졌는지는 잡 이름이 아니라 **스텝 이름**이 알려준다. 스위트 러너
# (run_verify_scripts.py · run_standalone_tests.py)도 첫 실패에서 안 멈추고 전부 돈 뒤
# 「N개 중 M개 통과」를 낸다. 둘 다 **대상 0건이면 실패**한다 (fail-closed).
#
# ── 경로 판정은 워크플로 레벨 `paths:` 가 아니라 **잡 안의 첫 스텝**이다 ────────
# `on.paths` 를 쓰면 필터 밖 PR 에서 **체크런이 아예 생기지 않아** required 로 걸 수 없다 —
# GitHub 이 그 이름을 영영 pending 으로 기다려 PR 이 머지 불가로 굳는다. 이 레포는 그것을
# 이미 한 번 겪고 되돌렸다 (#23 Task 4).
# 종전 처방은 `changes` 잡을 따로 두고 뒤 잡이 `if:` 로 읽는 것이었는데, 그 게이트 잡 자체가
# 잡 하나 = 1분이라 통합 뒤에는 **아끼려는 것보다 아끼는 장치가 비싸다.** 그래서 판정을
# **뒤 잡의 첫 스텝으로 인라인**한다 — 체크런은 항상 뜨고(required 안전), 무는 것이 없으면
# 나머지 스텝이 전부 건너뛴다. `test: repo` 는 레포 전역 규약이라 필터가 없다.
#
# ── 초안(draft)에서는 안 깨운다 ─────────────────────────────────────────
# 워커는 PR 을 draft 로 열고 스스로 확인한 뒤 ready 로 바꾼다. **두 겹이 필요하다**:
#   ① `types: [ready_for_review, synchronize, reopened]` — `opened` 를 빼서 PR 을 여는 것
#      자체로는 안 깨어난다.
#   ② 잡 레벨 `if:` — **draft 에도 `synchronize` 는 뜬다.** types 만으로는 draft 중 push 를
#      못 막는다. 건너뛴 잡은 `skipped` 체크런을 남기고 GitHub 은 그것을 통과로 세는데
#      (2026-08-25 실측), draft 는 애초에 머지가 안 되므로 문제가 아니다.
# ready 이후의 리뷰 지적 반영 push 는 `synchronize` 라 종전대로 돈다.
#
# ── 러너는 변수 하나로 갈린다 ───────────────────────────────────────────
# 레포 변수 `CI_RUNNER` 를 지우면 GitHub-hosted 로 돌아온다 — **YAML 은 안 바뀐다.**
# **기계 이름을 YAML 에 적지 않는다**: 라벨은 역할 이름이고, public 으로 되돌렸을 때 사설
# 기계의 존재가 파일에 남지 않는다.
#
# **포크 PR 은 변수가 뭐든 GitHub-hosted 에서 돈다.** 식의 앞 절이 그것이다 —
#   (pull_request 이고 head 레포가 이 레포가 아니면) → 'ubuntu-latest'
#   그 밖 → vars.CI_RUNNER, 없으면 'ubuntu-latest'
# 근거 둘: ㉠ GitHub 은 *"self-hosted runners should almost never be used for public
# repositories"* 라고 못박는다 — 포크 PR 이 우리 기계에서 코드를 돌리는 경로다.
# ㉡ 변수를 켠 상태에서 포크 PR 을 self-hosted 큐에 올리면 러너가 받을 때까지 안 돌아
# 「외부 기여자 PR 이 바로 돈다」가 거짓이 된다. 이 한 줄이 둘 다 닫는다.
# 레포 Actions 설정의 「포크 PR 워크플로 승인 요구」는 그 위에 겹치는 방어층이다.
#
# pull_request 에 branches(base) 제한을 안 두는 이유는 스택 PR (#281).
on:
  pull_request:
    types: [ready_for_review, synchronize, reopened]
  push:
    branches: [main]

# ── 낡은 실행을 끊는다 (PR 한정) ──────────────────────────────────────────
# group 키 근거: PR 은 `pull_request.number` 로 갈라 서로를 취소하지 않게, main push 는
# `github.sha` 로 갈라 큐잉·취소 자체가 일어나지 않게 한다 (머지된 커밋의 검증 기록을 잃지 않는다).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}   # 기본 0 — 잡별 최소 부여

jobs:
  # ── 서비스 계약·테스트·DB 계약 (종전 ci.yml 8잡) ──────────────────────────
  # 격리를 유지하던 둘을 한 잡에 담으면서 그 격리 근거를 **데이터베이스로** 옮겼다:
  #   · backend-db    — frontend 스키마를 DROP·재생성하는 파괴적 스크립트들. `ci` DB 를 쓴다.
  #   · alembic-drift — 유일하게 `alembic_version` 을 쓰고, **빈 DB** 와 **frontend 스키마
  #     부재**를 전제로 한다(`ALEMBIC_ALLOW_MISSING_FRONTEND_SCHEMA=1`). 같은 DB 를 쓰면
  #     서로 덮어써 #179 를 CI 가 그대로 재현하고, 그 선언도 거짓이 된다. 그래서 같은 서비스
  #     컨테이너 안에 **별도 데이터베이스 `alembic_verify_scratch`** 을 만들어 거기서만 돈다.
  backend:
    name: "test: backend"
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          # **호스트 포트를 고정하지 않는다.** GitHub-hosted 는 잡마다 VM 이라 5432 를 고정해도
          # 안 부딪히지만, self-hosted 는 한 기계에서 여러 잡이 돌아 두 번째가
          # `Bind for 0.0.0.0:5432 failed: port is already allocated` 로 죽는다 (2026-08-25 실측).
          # 컨테이너 포트만 적으면 GitHub 이 빈 호스트 포트를 골라 주고,
          # `job.services.postgres.ports['5432']` 로 그 값을 읽는다.
          - 5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # base…head 를 로컬에서 diff 하려면 두 커밋이 다 있어야 한다 (얕은 클론 불가).
          fetch-depth: 0

      - name: 경로 판정
        id: paths
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FILTER_PATTERNS: |
            multi-agent-service/**
            *-mcp-service/**
            backend-service/**
            bot-agent-service/**
            single-agent-service/**
            */app/core/security.py
            */app/core/auth_context.py
            */app/core/config.py
            scripts/verify_auth_lockstep.py
            *-service/CLAUDE.md
            scripts/verify_backend_claude_md.py
            backend-service/alembic/versions/**
            backend-service/app/models/schema.py
            scripts/verify_alembic_model_coverage.py
            */app/.env.example
            frontend/.env.example
            scripts/verify_env_example_coverage.py
            # 스위트 러너 — 고치면 이 파일의 전 잡에 영향
            scripts/run_standalone_tests.py
            scripts/run_verify_scripts.py
            # frontend Prisma 생성물 — backend-db 잡이 tables.sql 로 scratch DB 를 세운다.
            # 생성기·생성물만 바뀌면 트리거가 안 걸려 그 그물이 조용히 안 도는 상태였다.
            frontend/prisma/init/tables.sql
            frontend/prisma/table-generator.cjs
            # tables.sql 의 소스다 (#331) — 이것만 바뀌면 backend-db 잡이 낡은 커밋본으로
            # scratch DB 를 세운 채 초록이었다.
            frontend/prisma/schema.prisma
            # backend-tests 의 test_alembic_head_freshness.py 가 이 루트 스크립트의 판정 함수를
            # 검증한다 — 체커만 고치고 검사가 안 도는 구멍을 막는다 (#387)
            scripts/verify_alembic_head_freshness.py
            .github/workflows/**
        run: |
          if changed=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" 2>&1); then
            printf '%s\n' "$changed" | python3 scripts/ci_path_filter.py >> "$GITHUB_OUTPUT"
          else
            echo "::warning::변경 파일 목록을 못 구했다 (base=${BASE_SHA} head=${HEAD_SHA}) — 전 잡을 돌린다: ${changed}"
            python3 scripts/ci_path_filter.py --unknown >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # 서비스 컨테이너의 **실제** 호스트 포트를 env 로 편다. 잡 레벨 `env:` 는 `job` 컨텍스트를
      # 못 읽어서(스텝만 읽는다) 여기서 한 번에 깐다.
      - name: DB 접속 주소 확정 (서비스 컨테이너의 실제 호스트 포트)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: |
          CI_DB="postgresql://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci"
          {
            echo "WORKSPACE_MEMBER_TEST_DB_URL=$CI_DB"
            echo "ORPHAN_WORKSPACE_TEST_DB_URL=$CI_DB"
            echo "FRONTEND_FK_TEST_DB_URL=$CI_DB"
          } >> "$GITHUB_ENV"
          echo "서비스 컨테이너 postgres → localhost:${{ job.services.postgres.ports['5432'] }}"

      - name: multi-agent — 계약 검증 스크립트 (scripts/verify_*.py, fail-closed)
        working-directory: multi-agent-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: uv run python ../scripts/run_verify_scripts.py scripts

      - name: multi-agent — standalone tests (tests/test_*.py, fail-closed)
        working-directory: multi-agent-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: uv run python ../scripts/run_standalone_tests.py tests

      - name: bot-agent — standalone tests (tests/test_*.py, fail-closed)
        working-directory: bot-agent-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: uv run python ../scripts/run_standalone_tests.py tests

      - name: backend — 계약 검증 스크립트 (scripts/verify_*.py, fail-closed)
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: |
          uv run python ../scripts/run_verify_scripts.py scripts \
            --skip verify_workspace_member_default_unique.py \
            --skip verify_no_orphan_personal_workspaces.py \
            --skip verify_frontend_fk_referential_actions.py \
            --skip verify_bot_round_trip.py \
            --skip verify_schema_guard_on_downgraded_db.py \
            --skip verify_timestamptz_using.py

      - name: backend — standalone tests (tests/test_*.py, fail-closed)
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: uv run python ../scripts/run_standalone_tests.py tests

      - name: is_default 유일성 검증
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: uv run python scripts/verify_workspace_member_default_unique.py --i-know-this-drops-tables

      # 개인 워크스페이스 고아 감사 SQL 의 정밀도·재현율 (#280). deleteUserCascade(TypeScript)
      # 자체의 회귀는 frontend-ci.yml 의 frontend-db 잡이 잡는다 (#357 리뷰 [B]).

      - name: 개인 워크스페이스 고아 정합성 검사
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: uv run python scripts/verify_no_orphan_personal_workspaces.py --i-know-this-drops-tables

      # frontend 스키마를 세우는 두 길(prisma db push / tables.sql)의 FK 참조 동작 계약 (#238)
      # 분봉 파티션 커버리지 SQL — **진짜 Postgres 에 태운다.** 파이썬 단위 테스트는 레포지토리를
      # 대역으로 갈아 끼우므로 이 SQL 이 DB 앞에 한 번도 서지 않는다. 실제로 그 틈으로 깨진
      # 정규식이 새어 나가 「파티션이 있어도 없다」로 읽혔다(PR #182 리뷰).
      # **실행 여부까지 확인한다.** 이 스크립트는 DB URL 이 없으면 사유를 적고 건너뛴다
      # (`test: backend` 스위트에도 걸리므로 그 관례를 따른다). 그래서 여기서 URL 이 안 닿으면
      # 「건너뜀」이 조용한 초록으로 굳는다 — 실행 표식을 grep 해 그 자리를 막는다.

      - name: 분봉 파티션 조회 SQL 검증
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        env:
          MINUTE_PARTITION_TEST_DB_URL: postgresql://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci
        run: |
          out=$(uv run python scripts/verify_minute_partition_query.py)
          echo "$out"
          case "$out" in
            *"REQUIRE=db 실행됨"*) : ;;
            *) echo "::error::검사가 실제로 돌지 않았다 (DB URL 이 안 닿았다) — 건너뜀은 통과가 아니다"; exit 1 ;;
          esac

      # 백테스트 스키마 (#200) — 마이그레이션은 돌려 보지 않으면 검증이 아니다.
      # 구문이 맞아도 server_default·ondelete·복합 PK·JSONB 는 실제 서버가 거부할 수 있고,
      # 그때 알게 되는 자리는 배포다. 위와 같은 이유로 실행 표식을 grep 한다.

      - name: 백테스트 스키마 마이그레이션 검증
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        env:
          BACKTEST_TEST_DB_URL: postgresql+psycopg://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci
        run: |
          out=$(uv run python scripts/verify_backtest_schema.py)
          echo "$out"
          case "$out" in
            *"REQUIRE=db 실행됨"*) : ;;
            *) echo "::error::검사가 실제로 돌지 않았다 (DB URL 이 안 닿았다) — 건너뜀은 통과가 아니다"; exit 1 ;;
          esac

      # #200 완료 조건 — 「실행하면 결과가 DB 에 남는다」를 끝까지 태운다.
      # 독립 리뷰가 잡은 공백이다: 엔진 단위 테스트와 스키마 검사 **사이로** 배선이 빠져나갔다.
      # 서비스 → 엔진 → 저장소 → 조회를 한 줄로 통과시켜야 그 자리가 닫힌다.
      # M2 완료 판정의 「값이 소스와 일치한다」 — 적재 → 저장 → 조회를 한 줄로 태운다.
      # 각 층의 단위 테스트는 자기 층만 보므로, 그 사이에서 값이 변형돼도 아무도 못 잡는다.
      # 실제로 그 계통에서 `dt` vs `time` 이 하나 잡혔다 (#217).

      - name: 샘플 적재본이 소스와 값이 같은지 검증
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        env:
          BACKTEST_TEST_DB_URL: postgresql+psycopg://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci
        run: |
          out=$(uv run python scripts/verify_sample_roundtrip.py)
          echo "$out"
          case "$out" in
            *"REQUIRE=db 실행됨"*) : ;;
            *) echo "::error::검사가 실제로 돌지 않았다 — 건너뜀은 통과가 아니다"; exit 1 ;;
          esac

      # 0019 의 `USING` 술어 (#359). 아래 「Apply migrations to empty DB」 는 **빈 DB** 에 올리므로 값 해석이 한 번도
      # 실행되지 않는다 — 이 리비전의 위험은 DDL 구문이 아니라 기존 값의 뜻에 있다.
      # 리비전의 SQL 생성 함수를 그대로 import 해 쓰므로 두 벌이 갈리지 않는다.
      - name: timestamptz USING 술어 검증 (기원별 해석·되돌리기)
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        env:
          TIMESTAMPTZ_USING_TEST_DB_URL: "postgresql://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci"
        run: |
          out=$(uv run python scripts/verify_timestamptz_using.py --i-know-this-drops-tables)
          echo "$out"
          case "$out" in
            *"REQUIRE=db 실행됨"*) : ;;
            *) echo "::error::검사가 실제로 돌지 않았다 (DB URL 이 안 닿았다) — 건너뜀은 통과가 아니다"; exit 1 ;;
          esac

      # 세션 tz 기동 가드 (#359) — 대역을 끼우면 "옵션이 서버까지 가는가"가 빠지는데 그게 이
      # 가드가 지키는 바로 그것이다. 진짜 커넥션 둘에 태운다.
      - name: 세션 타임존 기동 가드 검증
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        env:
          SESSION_TIMEZONE_TEST_DB_URL: "postgresql+psycopg://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci"
        run: |
          out=$(uv run python scripts/verify_session_timezone_guard.py)
          echo "$out"
          case "$out" in
            *"REQUIRE=db 실행됨"*) : ;;
            *) echo "::error::검사가 실제로 돌지 않았다 (DB URL 이 안 닿았다) — 건너뜀은 통과가 아니다"; exit 1 ;;
          esac

      - name: 백테스트 실행이 결과를 남기는지 검증
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        env:
          BACKTEST_TEST_DB_URL: postgresql+psycopg://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci
        run: |
          out=$(uv run python scripts/verify_backtest_run_persists.py)
          echo "$out"
          case "$out" in
            *"REQUIRE=db 실행됨"*) : ;;
            *) echo "::error::검사가 실제로 돌지 않았다 (DB URL 이 안 닿았다) — 건너뜀은 통과가 아니다"; exit 1 ;;
          esac

      # 「아직 안 받았다」와 「없는 종목이다」가 같은 문구로 나오면 사용자가 자기 입력을
      # 의심한다 (#223). 키 없이 도는 소스가 생기면서 처음 생긴 상태라 단위 테스트가 못 본다.
      #
      # 이 검사만 `.env` 가 필요하다 — `bar_service` 가 `capability → data_key → logger → config`
      # 로 이어져 설정을 세운다. 값은 쓰지 않고 **존재만** 필요하므로 커밋된 예시를 그대로 쓴다
      # (`.env.development` 는 gitignore 라 러너에 없다).

      - name: 미적재와 없는 종목이 다른 답을 내는지 검증
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        env:
          APP_ENV: development
          BACKTEST_TEST_DB_URL: postgresql+psycopg://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci
        run: |
          cp app/.env.example app/.env.development
          out=$(uv run python scripts/verify_not_loaded_vs_missing.py)
          echo "$out"
          case "$out" in
            *"REQUIRE=db 실행됨"*) : ;;
            *) echo "::error::검사가 실제로 돌지 않았다 — 건너뜀은 통과가 아니다"; exit 1 ;;
          esac

      # 종목 검색의 값은 전부 SQL 안에 있다 — LIKE 이스케이프·순위 CASE·조회 상한 (#318).
      # 리포지토리를 대역으로 갈아 끼운 단위 테스트는 그 SQL 을 DB 앞에 한 번도 세우지 않는다.

      - name: 종목 마스터 검색 SQL 검증
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        env:
          BACKTEST_TEST_DB_URL: postgresql+psycopg://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci
        run: |
          out=$(uv run python scripts/verify_instrument_search.py)
          echo "$out"
          case "$out" in
            *"REQUIRE=db 실행됨"*) : ;;
            *) echo "::error::검사가 실제로 돌지 않았다 (DB URL 이 안 닿았다) — 건너뜀은 통과가 아니다"; exit 1 ;;
          esac

      - name: frontend FK 참조 동작 계약 검증
        working-directory: backend-service
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: uv run python scripts/verify_frontend_fk_referential_actions.py --i-know-this-drops-tables

      # alembic 전용 데이터베이스 — 위 DB 스텝들이 `ci` 를 DROP·재생성하며 쓰므로 드리프트
      # 검사는 **빈 DB** 를 따로 받아야 한다 (잡 머리 「격리 근거」).
      # 이름이 `_verify_scratch` 로 끝나는 이유: 파괴적 스크립트들이 대상 DB 이름을 화이트리스트
      # (`ci` 또는 `_verify_scratch` 접미사)로 막는다 — 개발·운영 DB 를 겨눈 실행을 막는 가드다.
      - name: alembic 전용 빈 DB 생성 (alembic_verify_scratch)
        id: alembic_db
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: backend-service
        run: |
          uv run python - <<'PY'
          import psycopg

          with psycopg.connect("postgresql://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/postgres", autocommit=True) as conn:
              conn.execute("DROP DATABASE IF EXISTS alembic_verify_scratch")
              conn.execute("CREATE DATABASE alembic_verify_scratch")
          print("alembic_verify_scratch 생성")
          PY

      - name: Apply migrations to empty DB
        id: alembic_upgrade
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' && steps.alembic_db.outcome == 'success' }}
        working-directory: backend-service/alembic
        env:
          ALEMBIC_DB_URL: postgresql+psycopg://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/alembic_verify_scratch
          ALEMBIC_ALLOW_MISSING_FRONTEND_SCHEMA: "1"
        run: uv run python -m alembic upgrade head

      # 안내는 이 스텝에만 붙인다 — 앞 스텝(upgrade) 실패는 드리프트가 아니라 마이그레이션
      # 자체의 오류다. 그래서 이 스텝에는 !cancelled() 를 붙이지 않는다(빈 DB 가 안 세워졌으면
      # 드리프트 판정 자체가 무의미하다 — 이 잡의 두 스텝은 순서 종속이다).

      - name: Alembic drift check
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' && steps.alembic_upgrade.outcome == 'success' }}
        working-directory: backend-service/alembic
        env:
          ALEMBIC_DB_URL: postgresql+psycopg://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/alembic_verify_scratch
          ALEMBIC_ALLOW_MISSING_FRONTEND_SCHEMA: "1"
        run: |
          uv run python -m alembic check || {
            echo "::error::모델(backend-service/app/models/schema.py)과 마이그레이션(backend-service/alembic/versions/)이 어긋났습니다."
            echo "::error::모델을 바꿨으면 리비전을 추가하세요: (cd backend-service/alembic && APP_ENV=development uv run python -m alembic revision --autogenerate -m \"설명\")"
            exit 1
          }

      # 스키마가 선 김에 봇 저장·조회를 실제 DB 로 왕복시킨다 (#150 B0). 정적 대조가 못 잡는
      # JSONB 바인딩·CHECK·CASCADE 를 여기서 본다. drift 판정과 독립이라 !cancelled() 를 붙인다.

      - name: 봇 저장·조회 왕복 검증
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' && steps.alembic_upgrade.outcome == 'success' }}
        working-directory: backend-service
        env:
          BOT_ROUND_TRIP_DB_URL: postgresql://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/alembic_verify_scratch
        run: uv run python scripts/verify_bot_round_trip.py --i-know-this-drops-tables

      # 스키마 판 가드(#311) — 여기가 유일하게 "한 판 되돌린 실제 DB" 를 만들 수 있는 자리다.
      # 스크립트가 downgrade -1 → 판정 → upgrade head 로 되돌려 놓는다.

      - name: 스키마 판 가드 회귀 (한 판 되돌린 DB)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' && steps.alembic_upgrade.outcome == 'success' }}
        working-directory: backend-service
        env:
          ALEMBIC_DB_URL: postgresql+psycopg://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/alembic_verify_scratch
          ALEMBIC_ALLOW_MISSING_FRONTEND_SCHEMA: "1"
        run: uv run python scripts/verify_schema_guard_on_downgraded_db.py --i-know-this-downgrades-schema

      - name: portfolio — 계약 검증 스크립트 (fail-closed)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: portfolio-mcp-service
        run: uv run python ../scripts/run_verify_scripts.py scripts

      - name: portfolio — standalone tests (fail-closed)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: portfolio-mcp-service
        run: uv run python ../scripts/run_standalone_tests.py tests

      - name: disclosure — standalone tests (fail-closed)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: disclosure-mcp-service
        run: uv run python ../scripts/run_standalone_tests.py tests

      - name: news — standalone tests (fail-closed)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: news-mcp-service
        run: uv run python ../scripts/run_standalone_tests.py tests

      - name: market-data — standalone tests (fail-closed)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: market-data-mcp-service
        run: uv run python ../scripts/run_standalone_tests.py tests

      - name: doc-search — standalone tests (fail-closed)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: doc-search-mcp-service
        run: uv run python ../scripts/run_standalone_tests.py tests

      - name: Auth lockstep check
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: python3 scripts/verify_auth_lockstep.py

      - name: Backend CLAUDE.md common section check
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: python3 scripts/verify_backend_claude_md.py

      # 마이그레이션이 만든 우리 테이블이 드리프트 검사 밖에 남는 것을 막는다 (#166) —
      # alembic 의 include_object 가 「모델에 없으면 남의 것」으로 빼므로, 모델에 안 올린
      # 우리 테이블은 컬럼이 사라져도 check 가 통과한다.

      - name: alembic 모델 커버리지 검사
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: python3 scripts/verify_alembic_model_coverage.py

      - name: Bootstrap env.example coverage check
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: python3 scripts/verify_env_example_coverage.py
  # ── 프론트엔드 정적 검사·테스트·실 DB 통합 (종전 frontend-ci.yml 3잡) ──────────
  # `npm ci` 를 한 번만 돌린다 — 종전엔 frontend·frontend-db 두 잡이 각자 받아 왔다.
  # 순서 하나가 계약이다: **`Unit tests (Prisma 클라이언트 없이)` 는 `npx prisma generate`
  # 앞에 있어야 한다.** 그 스위트는 클라이언트가 없는 상태를 검증 대상으로 삼는다.
  frontend:
    name: "test: frontend"
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          # **호스트 포트를 고정하지 않는다.** GitHub-hosted 는 잡마다 VM 이라 5432 를 고정해도
          # 안 부딪히지만, self-hosted 는 한 기계에서 여러 잡이 돌아 두 번째가
          # `Bind for 0.0.0.0:5432 failed: port is already allocated` 로 죽는다 (2026-08-25 실측).
          # 컨테이너 포트만 적으면 GitHub 이 빈 호스트 포트를 골라 주고,
          # `job.services.postgres.ports['5432']` 로 그 값을 읽는다.
          - 5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: "development"
      EMAIL_HOST: "smtp.example.com"
      EMAIL_PORT: "465"
      EMAIL_USER: "ci@example.com"
      EMAIL_PASSWORD: "ci"
      EMAIL_SECRET: "ci-secret-ci-secret-ci-secret-ci-secret"
      BETTER_AUTH_URL: "http://localhost:3010"
      BETTER_AUTH_SECRET: "ci-secret-ci-secret-ci-secret-ci-secret"
      JWT_SECRET: "ci-secret-ci-secret-ci-secret-ci-secret"
      BACKEND_SERVICE_URL: "http://localhost:8000"
      NEXT_PUBLIC_FILE_SERVICE_URL: "http://localhost:8000"
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # base…head 를 로컬에서 diff 하려면 두 커밋이 다 있어야 한다 (얕은 클론 불가).
          fetch-depth: 0

      - name: 경로 판정
        id: paths
        # 이 잡의 `defaults` 는 `frontend` 다 — 판정부는 레포 루트의 스크립트라 루트에서 돈다.
        working-directory: .
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          FILTER_PATTERNS: |
            # 이것이 빠지면 잡이 아예 안 돈다 — 그물이 걸려 있지 않은 상태(#241·#252 계열)
            frontend/**
            # 레포 루트 scripts/ 아래라 frontend/** 밖이다
            scripts/verify_filter_negation.mjs
            # 위 스크립트가 #389 형식 오류 축을 읽는 곳
            scripts/fixtures/filter_conformance_cases.json
            # frontend-db 잡이 public 스키마를 세우는 데 쓴다 (#363)
            backend-service/alembic/**
            # 레포 루트다 (#365) — 고지 문서만 손대는 커밋에서 그 대조가 안 도는 구멍을 막는다.
            # 문서가 서술하는 대상(프로덕션 의존성)이 바뀌는 축은 frontend/** 안의
            # package-lock.json 이 이미 덮는다.
            THIRD-PARTY-NOTICES.md
            scripts/verify_notice_counts.py
            scripts/generate_notices.py
            # verify_write_gate_coverage.py 가 읽는 다른 한쪽 축 (#341) — 백엔드에서 require_role 이
            # 빠지거나 라우터 prefix 가 바뀌면 화면의 사전 설명이 어긋나는데, frontend/** 만 보면
            # 그 변경에서 이 검사가 안 돈다.
            backend-service/app/routers/**
            backend-service/app/core/authorization.py
            scripts/verify_write_gate_coverage.py
            # 게이트를 고치는 변경이 자기 검증을 못 받으면 러너 위 동작은 머지 후에야 드러난다 (#217)
            .github/workflows/**
        run: |
          if changed=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" 2>&1); then
            printf '%s\n' "$changed" | python3 scripts/ci_path_filter.py >> "$GITHUB_OUTPUT"
          else
            echo "::warning::변경 파일 목록을 못 구했다 (base=${BASE_SHA} head=${HEAD_SHA}) — 전 잡을 돌린다: ${changed}"
            python3 scripts/ci_path_filter.py --unknown >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: npm ci --ignore-scripts

      - name: 전이 devextreme 의존 검사
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: node scripts/check-terminal-devextreme-transitive.js

      # 위 검사가 **무엇을 막는지**를 매번 주입으로 증명한다. exit 0 만으로는 "위반이 없다"와
      # "그 패키지를 애초에 안 본다"가 구분되지 않는다 — 실제로 걷어낸 6종 중 4종이 안 보이는
      # 채로 이 잡이 초록이었다(PR #417 독립 리뷰). 6종을 하나씩 주입해 6번 다 빨간불인지,
      # 허용 대상(MIT 포크)은 초록인지 확인하고, 검사 건수가 목록과 다르면 그것만으로 실패한다.

      - name: 재도입 그물 커버리지 — 6종 주입 시험
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: bash scripts/injection-probe-devextreme.sh

      # 역할 게이트가 걸린 쓰기(21개 엔드포인트)를 화면이 **누르기 전에** 설명하는지 (#341).
      # backend 의 require_role ↔ frontend 의 역할·prefix·조작부를 네 축으로 대조하고, 축마다
      # 검사 건수를 출력에 남긴다. 대상이 0건이면 실패한다. 레포 루트 기준 경로를 쓴다.

      - name: 역할 게이트 쓰기 사전 설명 대조
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: .
        run: python3 scripts/verify_write_gate_coverage.py

      # app/api 라우트의 getKSTTime() 재유입 (#372) — #303 의 회귀 그물은 실제 라우트를
      # import 하지 않아 어느 라우트가 다시 써도 초록으로 남는 구멍이 있었다.

      - name: app/api 라우트 getKSTTime() 재유입 검사
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: node scripts/check-no-kst-time-in-routes.js

      # --ignore-scripts: 루트 postinstall(prisma generate)과 엔진 다운로드를 건너뛴다.
      # install script 를 가진 devDependency 는 sharp 하나뿐이고(#361), 그 스크립트는
      # 프리빌트가 없을 때 소스 빌드로 넘어가는 폴백이다 — linux-x64 는 프리빌트 패키지
      # `@img/sharp-libvips-linux-x64` 가 바이너리를 그대로 싣고 오므로 스크립트 없이도 로드된다
      # (로컬 `npm ci` 가 스크립트를 안 돌린 상태에서 sharp.versions 를 읽어 확인).

      - name: 브랜드 자산 재현 대조
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: node scripts/generate-brand-assets.js --check

      # THIRD-PARTY-NOTICES.md 의 기계 소관 구간(개수·목록·§1 라이선스 원문)이 지금 lockfile
      # 에서 그대로 재현되는지 본다 — 브랜드 자산과 같은 형태(생성기 + `--check`)다. 의존성이
      # 바뀌면 `python3 scripts/generate_notices.py` 로 다시 만들어 커밋하면 된다(손으로 세지
      # 않는다). 아래 검사기를 대체하지 않는다: 이 스텝은 「생성기 출력 == 커밋된 문서」를,
      # 아래 스텝은 「문서를 다시 파싱한 결과 == 실측」을 본다.

      - name: THIRD-PARTY-NOTICES 재현 대조 (생성기 --check)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: .
        run: python3 scripts/generate_notices.py --check

      # THIRD-PARTY-NOTICES.md 의 숫자·목록 ↔ 실측 (#365) — 위 생성기와 **독립된 판정**이다.
      # 생성기 출력을 믿지 않고 문서를 다시 파싱하므로, 생성기가 틀리면 여기서 갈린다
      # (생성기 버그를 생성기로 검증하면 두 스크립트가 같은 버그를 공유한다).
      # 문서 최상단의 재현 명령을 그대로 다시 돌려 **이름@버전 집합을 양방향으로** 대조한다
      # (개수만 맞추면 「하나 빠지고 하나 더 들어온」 상태가 통과한다).
      # node_modules 가 필요해 repo-scans 의 stdlib 잡이 아니라 여기 산다 — npm ci 뒤여야 한다.

      - name: THIRD-PARTY-NOTICES 숫자 대조 (fail-closed)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: .
        run: python3 scripts/verify_notice_counts.py

      # tables.sql 은 schema.prisma 가 낳는 커밋된 생성물인데 재현 대조가 없었다 (#331) —
      # `test: frontend-db` 는 재생성본을, ci.yml 의 `test: backend-db` 는 커밋본을 적용하므로
      # 재생성을 잊으면 두 잡이 서로 다른 스키마를 검증한다. 판정 기준이 HEAD 의 blob 이라
      # 이 스텝의 위치는 아래 `Generate Prisma client` 앞뒤 어디여도 결과가 같다.

      - name: tables.sql 재현 대조 (커밋본 == 생성기 출력)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: node scripts/check-tables-sql-reproducible.js

      # ⚠ prisma generate **앞**에 둔다 (머리 주석의 순서 계약). 수집된 테스트가 0건이면
      # vitest 가 exit 1 한다 (vitest.config.ts 의 passWithNoTests: false) — 그 방어를 지우는
      # `--passWithNoTests` 는 붙이지 않는다. pretest 훅이 check-deps-sync.js 도 함께 돌린다.

      - name: Unit tests (Prisma 클라이언트 없이)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: npm test

      # DevExtreme 자신의 평가기를 심판으로 세워 filters.ts 의 where 변환이 같은 행 집합을
      # 내는지 대조한다 (#293) — devextreme 패키지를 frontend/node_modules 에서 그대로 읽고,
      # 스크립트는 레포 루트 기준 경로를 쓰므로 루트에서 실행한다.

      - name: 헤더필터 부정 회귀 검사
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: .
        run: node scripts/verify_filter_negation.mjs

      # package.json 의 "lint" 스크립트는 --fix 라 CI 에서 돌리면 위반을 조용히 고치고
      # 통과해버린다(게이트 무력화, #265). --fix 없이 직접 호출해 위반을 실패로 드러낸다.
      # eslint.config.mjs 는 parserOptions.project 를 안 써 타입 인지 린트가 아니다 —
      # Prisma 생성 클라이언트 없이도 정확하다.

      - name: Lint
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: npx eslint .

      # 드라이버 어댑터 기반 생성기라 엔진 바이너리 다운로드가 없다(실측 92ms, 네트워크 대기
      # 없음) — postinstall 전체 대신 이것만 돌린다.

      - name: Generate Prisma client
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: npx prisma generate

      # 실제 라우트 핸들러를 withAuth 까지 포함해 그대로 import 하는 회귀 (#337) — 그 체인이
      # utils/common/api/responses.ts 를 거쳐 @/prisma/generated/client 를 문다. mock 으로
      # 바꾸면 "실제 핸들러를 호출해 검사한다"는 이 그물의 가치가 사라지므로 바꾸지 않는다.

      - name: API 라우트 회귀 테스트
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: npm run test:api-regressions

      # API 라우트 다수가 Prisma 생성 타입을 참조하므로 generate 뒤에 둔다 (#265).

      - name: Type check
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: npx tsc --noEmit

      # 죽은 코드(아무도 안 부르는 파일·export·의존성)가 늘어나지 않게 상한으로 잠근다 (#286).
      # 축별 수가 상한과 **정확히 같아야** 통과한다 — 걷어낸 PR 은 상한도 함께 내린다.
      # 상한을 넘든 밑돌든 빨간불이므로, 통과가 "0건"인지 "안 봤음"인지 헷갈릴 자리가 없다.
      # knip 버전은 스크립트가 박아 두고 npx 로 받는다(node_modules 에 안 얹는다 — 이 검사가
      # 자기 자신을 미사용 의존성으로 세는 것을 피한다).

      - name: 죽은 코드 상한
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: node scripts/check-dead-code.js

      - name: Install uv
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # 서비스 컨테이너의 **실제** 호스트 포트를 env 로 편다 — 잡 레벨 `env:` 는 `job` 컨텍스트를
      # 못 읽는다(스텝만 읽는다). 아래 `npm run test:db` 가 이 값을 본다.
      - name: DB 접속 주소 확정 (서비스 컨테이너의 실제 호스트 포트)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: |
          echo "DATABASE_URL=postgresql://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci?schema=frontend" >> "$GITHUB_ENV"
          echo "서비스 컨테이너 postgres → localhost:${{ job.services.postgres.ports['5432'] }}"

      - name: Apply frontend schema (tables.sql)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        # **서비스 컨테이너 안의 psql 로 돌린다.** 호스트의 `psql` 을 쓰면 self-hosted 러너에
        # 그 도구가 없을 때 죽는다 (2026-08-25 실측: 이 기계에 postgresql-client 가 없어
        # `test: frontend` 가 여기서 실패했다). 컨테이너 id 는 GitHub 이 잡 컨텍스트로 준다 —
        # hosted·self-hosted 어느 쪽에서도 같은 명령이다.
        run: |
          docker exec -i -e PGPASSWORD=ci "${{ job.services.postgres.id }}" \
            psql -U ci -d ci -v ON_ERROR_STOP=1 < prisma/init/tables.sql

      - name: Apply public schema (alembic)
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        working-directory: backend-service/alembic
        env:
          ALEMBIC_DB_URL: postgresql+psycopg://ci:ci@localhost:${{ job.services.postgres.ports['5432'] }}/ci
        run: uv run python -m alembic upgrade head

      - name: deleteUserCascade 통합 테스트
        if: ${{ !cancelled() && steps.paths.outputs.run == 'true' }}
        run: npm run test:db
  # ── 레포 전역 규약 (종전 repo-scans.yml 5잡) ─────────────────────────────
  # **경로 필터가 없다.** 이 잡의 스캔은 대상을 서비스 이름으로 가리지 않고 스스로 찾는다
  # (`git ls-files` 전수·서비스-이름-무관 글롭). 필터를 걸면 목록에 없는 **새 서비스**의
  # 결함이 「초록도 빨강도 아니고 검사가 존재하지 않는」 상태가 된다 (#302).
  # 각 스크립트는 스스로 fail-closed 다 — 검사 건수를 출력하고 0건이면 실패한다.
  repo:
    name: "test: repo"
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read   # PR 커밋 저자 신원 조회
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 스크립트가 `uvx ruff@<rev>` 로 훅과 같은 ruff 를 받는다 — 버전은 스크립트가
      # `.pre-commit-config.yaml` 에서 읽으므로 여기에 적지 않는다 (lockstep).
      - name: Install uv
        if: ${{ !cancelled() }}
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: CI 배선 대조 (검증 단위 전수 ↔ 워크플로 실행 목록)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_ci_check_coverage.py

      # main push 에는 대조할 브랜치 선언이 없다 — 종전 잡 레벨 `if:` 를 스텝으로 옮겼다.
      - name: PR 커밋 저자 신원 ↔ 브랜치 선언 대조 (fail-closed)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # 브랜치명·로그인은 데이터로만 다룬다 — 셸 보간에 넣지 않는다
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          IS_BOT: ${{ github.event.pull_request.user.type == 'Bot' }}
        run: |
          set -uo pipefail
          set +e
          # 조회 실패를 빈 목록으로 흡수하지 않는다 — 판정부의 R0 이 그것을 위반으로 잡아야
          # 하므로 실패는 `null` 로 넘겨 「읽지 못했다」를 그대로 전달한다
          COMMITS=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | {sha, author_email: .commit.author.email, author_name: .commit.author.name}' \
            | jq -s '.') || COMMITS=""
          jq -n --arg ref "$HEAD_REF" --argjson bot "$IS_BOT" \
                --argjson commits "${COMMITS:-null}" \
                '{head_ref: $ref, pr_author_is_bot: $bot, commits: $commits}' \
            | python3 scripts/pr_authorship.py
          RC=$?
          if [ "$RC" -ne 0 ]; then
            echo "::error::PR 의 커밋 저자 신원을 읽을 수 없거나 브랜치 선언과 어긋난다 — 위 사유를 보고 디스패치의 §6.1 신원 설정(git config --worktree user.email)을 확인하라"
          fi
          exit "$RC"

      - name: 파이썬 포맷·린트 전수 (pre-commit 과 같은 범위, fail-closed)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_python_format.py

      # 훅과 **같은 버전**을 릴리스 해시로 고정해 받는다. 버전을 여기에만 적으면 훅과 갈리므로
      # `.pre-commit-config.yaml` 의 rev 와 대조해 어긋나면 실패한다.
      # 바이너리는 `$RUNNER_TEMP` 에 푼다 — 작업 트리에 두면 스캔 대상에 자기 자신이 섞인다.

      - name: 시크릿 스캔 (gitleaks — 훅과 같은 버전, fail-closed)
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: "8.21.2"
          GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"
        run: |
          set -euo pipefail
          HOOK_REV=$(sed -n '/gitleaks\/gitleaks/,+3{s/^[[:space:]]*rev:[[:space:]]*v\{0,1\}//p;}' .pre-commit-config.yaml | head -1)
          if [ -z "$HOOK_REV" ]; then
            echo "::error::.pre-commit-config.yaml 에서 gitleaks rev 를 못 읽었습니다 — 훅과 같은 버전이라는 근거가 사라집니다"
            exit 1
          fi
          if [ "$HOOK_REV" != "$GITLEAKS_VERSION" ]; then
            echo "::error::훅의 gitleaks v${HOOK_REV} 와 이 잡의 ${GITLEAKS_VERSION} 이 어긋납니다 — 버전과 GITLEAKS_SHA256 을 함께 올리세요"
            exit 1
          fi
          TRACKED=$(git ls-files | wc -l)
          echo "gitleaks ${GITLEAKS_VERSION} (훅 rev 와 일치) · 추적 파일 ${TRACKED}건"
          if [ "$TRACKED" -eq 0 ]; then
            echo "::error::스캔 대상을 0건 수집했습니다 — 통과가 아닙니다"
            exit 1
          fi
          # `--retry` — self-hosted 러너의 일시 네트워크 오류로 이 스텝이 죽었다
          # (2026-08-25 실측: `curl: (35) Recv failure: Connection reset by peer`).
          # 무결성은 아래 sha256 대조가 지키므로 재시도는 안전하다.
          curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors \
            -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --no-git --redact --source .

      - name: 무결성 핸들러 exc_info 유출 검사
        if: ${{ !cancelled() }}
        working-directory: backend-service
        run: python3 tests/test_constraint_handler_no_exc_info.py

      # 절대 날짜 리터럴 (#269 안 A) — */app/clients/**·*/app/schemas/** 에 "시간이 지나면
      # 낡는 고정 날짜" 재유입 차단. 글롭이 서비스 이름을 안 가리므로 새 서비스도 자동 대상.

      - name: 절대 날짜 리터럴 스캔
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_no_absolute_dates.py

      # 루트 문서 위생 (#295) — 정문(루트 *.md)에 선언한 것만 놓였는지 + 코드가 가리키는
      # .docs/ 문서가 실재하는지. 끝난 작업 일지가 루트에 다시 놓이거나, 문서를 옮겨
      # 코드 주석의 포인터가 끊기면 여기가 빨간불이 된다.

      - name: 루트 문서 위생 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_root_doc_hygiene.py

      # 리뷰 룰의 Detection pathspec (#330) — review-* 에이전트가 그대로 실행하는 글롭이
      # `:(glob)` 매직을 선언하고, 대상 파일을 실제로 맞히는지. 종전에는 `**/` 가 깊이 1 을
      # 빼서 각 서비스의 app/main.py 12개가 룰 5개의 사정권 밖이었는데 보고서는 「통과」였다.

      - name: 리뷰 룰 Detection pathspec 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_detection_pathspec.py

      # 리뷰어 배정 판정 (cross-review.yml 의 route 잡이 부르는 순수 판정) — 저자 판별·위험도
      # 판독·리뷰어 배정. 종전엔 YAML 안 bash 라 단위 테스트가 없었다.

      - name: 리뷰어 배정 판정 회귀 그물
        if: ${{ !cancelled() }}
        run: python3 scripts/test_review_route.py

      # 설계 결정 번호(AD-N) 유일성 (#343) — 접두사 누락 + 같은 접두사 번호의 중복 정의

      - name: 설계 결정 번호(AD-N) 유일성 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_ad_numbering.py

      # 로컬 기동 정의의 포트 위생 (#308 #294) — 포트 강탈 명령(fuser -k·pkill·kill -9) 금지 +
      # 프론트 포트 ↔ 전 서비스 CORS 기본값·BETTER_AUTH_URL lockstep +
      # 로컬 DB 포트 ↔ .env.example·부트스트랩·스크립트 기본값 lockstep + 생태계 기본 포트(3000·5432) 금지

      - name: 기동 정의 포트 위생 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_dev_port_hygiene.py

      # 전 서비스 포트 설정 범위 제약 (#271 #377) — */app/core/config.py 의 *_PORT 필드 전수에
      # Field(gt=0, le=65535) 가 걸려 있는지. 제약이 실제로 0·음수를 거부하는지의 행동 검증은
      # ci.yml 의 backend 스위트(verify_config_positive_values.py)가 맡는다.

      - name: 포트 설정 범위 제약 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_config_port_bounds.py

      # 공개 배포 트리 게이트 (#360 #287) — 이사 트리 이관 스크립트가 push 직전에 돌리는 것과
      # **같은** 검사기를 매 PR 에서도 돌린다. 공개 push 는 회수 불가라 이관 날에 처음 알면 늦다.
      # 이사 뒤에는 이관 한 걸음이 사라지고 이 잡만 남는다 — 공개 레포에서는 머지가 곧 공개라
      # 이것이 「공개본에 들어가면 안 되는 것」을 막는 유일한 자동 그물이 된다.

      - name: 공개 배포 트리 게이트
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_public_release_tree.py

      # 공개 배포 게이트 우회 재현 (#406) — 위 트리 스캔은 **지금 트리에 위반이 없음**을
      # 보이지만, 게이트가 무엇을 잡아야 하는지는 안 보인다. 검사 규칙을 통째로 지워도
      # 트리가 깨끗하면 그대로 초록이다. 그래서 우회를 케이스로 못박는 두 번째 단계를 둔다.
      # 우회 두 종(인라인 자산·원격 자기 지정)이 다시 열리면 여기가 빨간불이 된다.
      #
      # 「③ 문서화된 우회」는 방향이 반대다 — **안 막기로 한 것(언어 층 이스케이프)이 계속
      # 안 막히는지**를 고정한다. 누가 막으면 거기가 빨간불이 나서 독스트링·이관 도구 문서를
      # 같이 갱신하게 된다. 그래서 이 스텝의 초록은 「전부 막혔다」가 아니고, 출력이 그렇게 말한다.
      # 케이스를 0건 수집하면 실패한다 (fail-closed).

      - name: 공개 배포 게이트 우회 재현
        if: ${{ !cancelled() }}
        run: python3 scripts/test_public_release_gate.py

      # 터미널 준비·접수 판정 (#23 Task 2) — 리뷰 워커 터미널에서 실제로 읽은 화면으로 판다.
      # 종전 판정은 `latestCursor` 성장을 신호로 썼는데 Claude Code TUI 에서 그 값이 안 움직여
      # 리뷰 경로가 통째로 죽었다. 화면은 우리가 못 고치는 런타임 산출물이라, 판정이 어느 화면을
      # 무엇으로 읽는지를 케이스로 못박아 둔다. 케이스를 0건 수집하면 실패한다 (fail-closed).

      - name: 터미널 준비·접수 판정 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_terminal_state.py

      # 리뷰어 체인 처분·집계 — cross-review.yml 의 후보 루프가 부르는 순수 판정. 「그 리뷰어를
      # 못 쓴다」(다음 후보로)와 「리뷰가 불가능하다」(unable)가 갈려 있는지를 못박는다. 종전엔
      # 기동 실패가 후자로 접혀 체인이 첫 후보에서 끝났고(실측 run 31815113895), unable 이 나면
      # 낡은 CHANGES_REQUESTED 가 살아남아 PR 이 교착에 빠진다. 반대로 이 자리가 너무 관대해지면
      # 고장난 리뷰어가 조용히 claude 자기리뷰로 대체된다 — 양쪽을 다 케이스로 잡는다.
      # 케이스를 0건 모으면 실패한다 (fail-closed).

      - name: 리뷰어 체인 처분·집계 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_review_chain.py

      # 위 판정이 옳아도 **워크플로가 그것을 안 부르면** 초록은 거짓말이다 — 이번 결함이 정확히
      # 그것이었다(YAML 안 bash `case` 가 rc 두 종만 폴백으로 인정). 그래서 체인 루프를
      # cross-review.yml 에서 **그대로 뽑아** Actions 기본 셸과 같은 `bash -e` 로 돌린다
      # (헤더 「셸 플래그 함정」: -e 를 안 끄면 폴백이 통째로 안 돌던 실사건이 있고, 그때 로컬
      # 56케이스가 통과한 이유가 `bash -e` 로 안 돌린 것이었다). 앵커가 밀려 엉뚱한 블록을
      # 뽑으면 실패한다 (fail-closed).

      - name: 리뷰어 체인 루프 검사 (워크플로 원문 · bash -e)
        if: ${{ !cancelled() }}
        run: python3 scripts/test_cross_review_chain_loop.py


      # 경로 필터 판정 (#23 Task 4) — ci.yml·frontend-ci.yml 의 `changes` 잡이 부르는 순수
      # 판정 + **배선 구조 자체**. 글롭 의미만 보면 "판정은 맞는데 아무도 안 부르는" 상태가
      # 초록이므로, on.paths 재유입·판정 잡 부재·`if:` 안 읽는 잡·추적 파일을 하나도 안 무는
      # 죽은 패턴을 같이 본다. 이 잡은 경로 필터가 없어 그 그물 자신은 항상 돈다.

      - name: 경로 필터 판정·배선 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_ci_path_filter.py

      # 머지 게이트 판정 (#23 Task 5) — 통과 집합(success·skipped)과 상류 0건 실패.
      # 게이트는 초록일 때 아무 일도 안 하는 검사라 죽어도 티가 안 난다.
      # 케이스를 0건 모으면 실패한다.

      - name: 머지 게이트 판정 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_upstream_gate.py

      # 게이트의 **구조** 판정 — 대표자 잡(`test: gate`)을 없앤 뒤 이 판정부를 실제로 돌리는
      # 자리는 자동 머지 arm 스텝 하나뿐이고, 그건 리뷰가 끝난 뒤에야 돈다. 그래서 「테스트
      # 잡이 하한 미만」·「대표자 잡 부활」·「대기 루프 계약 파손」을 PR 이 돌 때 여기서 본다.
      # `--structure-only` 는 표준입력을 안 읽는다 (체크런 조회 없이 선언만 대조).

      - name: 머지 게이트 구조 대조 (테스트 잡 하한 · 대기 루프 계약)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_upstream_gate.py --structure-only

      # pre-commit 훅 ↔ CI 대조 판정 (`test: ci-coverage` 가 부르는 순수 판정). 이 대조는
      # 초록일 때 아무 일도 안 하는 검사라 관대해져도 티가 안 난다 — 새 훅을 모른 척하거나
      # 사라진 대응을 배선된 것으로 세는 방향을 케이스로 못박는다. 0건 수집이면 실패.

      - name: pre-commit ↔ CI 대조 판정 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_ci_check_coverage.py

      # 리뷰 기록기 판정 (#23 Task 7) — review-record.yml 이 부르는 순수 판정. 공개 레포의
      # 위조 표면(비-멤버 마커·접두 sha·낡은 sha·source=manual·major 봇 PR·제목 파싱 실패)이
      # 봇 승인·자동 머지 arm 으로 이어지지 않는지를 공격 케이스로 못박는다.
      # 케이스를 0건 모으면 실패한다 (fail-closed).

      - name: 저자 신원 판정 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_pr_authorship.py

      # 머지 본문 재현이 실물과 어긋나면 `--body-file` 이 커밋 메시지와 Co-authored-by 를
      # 지운다. 픽스처는 머지된 PR 의 실제 본문이다 (`fixtures/squash_bodies.json`).

      - name: 머지 provenance 판정·본문 재현 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_merge_provenance.py

      - name: 리뷰 기록기 판정 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_review_record.py

      # 쓸어담기 판정 — 「조용히 죽은 리뷰·머지」를 결과로 줍는다. 종전 runner-freeze-rerun.yml
      # 의 자리를 물려받았는데 **그 워크플로가 정확히 조용히 죽어 있었다**(365번 깨어나 재실행
      # 0건 · 진짜 동결 4건 전부 놓침 — 원인은 판정 근거를 run conclusion 에 둔 것). 그래서
      # 「동결은 잡 annotation 으로 본다」를 케이스로 못박는다. 0건 모으면 실패한다.
      - name: 쓸어담기 판정 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_review_sweep.py

      # 문서 전용 판정 (#23 Task 8) — docs-notice 잡이 부르는 순수 판정. cross-review 의
      # paths-ignore 와 어긋나면 리뷰가 돈 PR 에 「리뷰 없음」이 붙거나 그 반대가 된다.

      - name: 문서 전용 판정 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_review_notice.py


      # 고지 문서 생성기의 fail-closed 축 (앵커 파손·미분류 라이선스·§3 보존·--check).
      # frontend 잡의 `generate_notices.py --check` 는 **지금 트리가 맞는지**만 보인다 —
      # 생성기가 무엇을 막는지는 안 보이므로, 앵커를 지우거나 분류표를 비워도 트리가
      # 깨끗하면 그대로 초록이다. 여기서 그 축을 합성 픽스처로 못박는다(node_modules 불필요).

      - name: 고지 문서 생성기 회귀 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/test_notices_generator.py

      # 색 토큰 조합 전수의 WCAG 대비 (#73 S1, 디자인 시스템 §7.1) — 토큰을 하나 손보면 그
      # 토큰이 얹히는 모든 바탕과의 조합이 같이 움직이는데 사람이 그 곱집합을 매번 다시 재지는
      # 않는다. 계산식은 WCAG 명세 2점 + 문서의 손계산 3점으로 고정한다.
      # **지금은 보고만 하고 미달로 실패하지 않는다** — 색 값이 리드 판단 대기다. 조이는 방법은
      # 스크립트 머리의 「나중에 조이는 방법」에 적혀 있다. 조합 0건이면 실패한다 (fail-closed).

      - name: 색 토큰 대비 검사 (보고)
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_token_contrast.py

      # 토큰 밖 색 검출 (#73 S1, 디자인 시스템 §8) — Tailwind 기본 팔레트·hex 리터럴은 아무
      # 설정 없이 그냥 써지고 타입체커도 린터도 조용하다. 기존 위반은 상한과 함께 allowlist 에
      # 등록했고 S2~S5 가 줄인다 — 늘어나거나 낡으면 실패한다. 검사 0건이면 실패 (fail-closed).

      - name: 토큰 밖 색 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_color_token_usage.py

      # 아이콘 조작부의 표적 클래스 (#289) — 크기를 재는 그물(frontend `npm test` 의
      # touchTargets)은 손으로 고른 픽스처만 본다. 새 아이콘 버튼이 픽스처에 안 들어가면
      # 그 자리는 조용히 초록이다(실측: `×` 두 자리가 그렇게 빠졌다). 여기서는 크기 대신
      # 「공용 클래스를 안 쓴 자리」를 센다. 후보 0건이면 실패 (fail-closed).

      - name: 아이콘 표적 클래스 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_icon_hit_area.py

      # 실패 사유가 화면으로 나가는 자리의 가림 (#274) — **경로 필터가 없는 이 잡에 둔다.**
      # `ci.yml` 의 백엔드 잡에 두면 `FILTER_PATTERNS` 에 `frontend/**` 가 없어, 프론트만 바꾼
      # PR(= 이 그물이 지켜야 할 바로 그 클래스)에서 조용히 skip 된다. 실제로 그 상태였다.

      - name: 실패 사유 가림 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_reason_redaction.py

      # 프록시 라우트가 자기 폴더의 서비스만 가리키는가 (#361) — 같은 앱을 두 이름으로 가리키면
      # 그 둘이 어긋나는 날 화면이 「총 0건」으로 조용히 죽는다. 위 가림 검사와 같은 이유로
      # 경로 필터가 없는 이 잡에 둔다 — 프론트만 바꾼 PR 에서도 돌아야 한다.

      - name: 프록시 라우트 env 이름 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_external_proxy_env_names.py

      # 바탕을 안 칠한 자리 (#281) — **대비 검사가 원리적으로 못 잡는** 구멍이다. 흰 바탕에
      # 다크 잉크는 대비가 높아서 통과한다. 결함은 대비가 아니라 「바탕이 틀린 것」이다.

      - name: 서피스 바탕 칠 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_surface_paints_background.py

      # 제품이 자기 상태를 잘못 말하는 것 (#290·#293) — 정문과 제품 홈이 **둘 다** 백테스트를
      # 「아직 없다」고 말하는 동안 라우터는 등록돼 있었고 격자는 값으로 차 있었다. 사람이 손으로
      # 고치는 것 말고 갱신 경로가 없어서 낡았다. 프론트 상수와 백엔드 등록을 함께 읽으므로
      # 경로 필터가 없는 이 잡의 클래스다.

      - name: 단계 주장 대조
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_stage_claims.py

      # 정문이 말하는 사실이 낡는 것 (#329) — 서비스 표·모듈 목록·아키텍처 규칙 7건이 동시에
      # 코드와 어긋나 있었다. 위 단계 그물과 같은 부류이고(사람이 손으로 고치는 것 말고 갱신
      # 경로가 없다), README·루트 CLAUDE.md·process-compose·backend 등록을 함께 읽으므로
      # 경로 필터가 없는 이 잡의 클래스다.

      - name: 정문 문서 주장 대조
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_front_door_claims.py

      # 비텍스트 토큰을 글자에 쓰는 것 (#73 리드 결정 ㉡) — 위 두 그물 **사이**에 난 구멍이다.
      # 대비 검사는 「비텍스트니 검사 안 함」으로, 색 사용 검사는 「등록된 토큰이니 위반 아님」으로
      # 넘겨, 규격상 못 읽는 값이 글자로 새어 나간다(실측: PR #161). 검사 0건이면 실패.

      - name: 비텍스트 토큰의 텍스트 오용 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_non_text_token_usage.py

      # 프록시 라우트 ↔ 서비스 소비자 (#2) — `frontend/app/api/external/**` 를 스스로 순회해
      # 대상을 찾는 stdlib 스캔이라 이 잡의 클래스다. 경로 필터가 있는 워크플로에 두면 이
      # 그물이 존재해야 할 바로 그 PR 클래스(고아 라우트 추가·소비자 삭제·체커만 수정)에서
      # 목록에 안 걸려 조용히 skip 된다 — 실제로 ci.yml 의 repo-contracts 에 있던 동안
      # 그 상태였다. 여기서는 경로 필터가 없어 매 PR 마다 돈다.

      - name: 프록시 라우트 소비자 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_proxy_route_consumers.py

      # 프론트↔백엔드 lockstep 2종 (#331) — 입력이 두 서비스에 걸쳐 있어 어느 한쪽의 경로
      # 목록에도 온전히 안 담긴다. ci.yml 의 `test: backend` 스위트에 있던 동안, 이 그물이
      # 막으려던 실수가 들어오는 유일한 경로(프론트만 바뀐 PR)에서 잡이 통째로 skipped 였다
      # — 최근 머지 40건 중 8건이 그 경우였고 2건은 그물 글롭에 드는 파일을 고쳤다.
      # stdlib 텍스트·AST 대조라 이 잡의 클래스다.

      - name: capability data_kind·job_kind·status lockstep 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_capability_kind_lockstep.py

      - name: 백테스트 응답 계약 lockstep 검사
        if: ${{ !cancelled() }}
        run: python3 scripts/verify_backtest_contract_lockstep.py

      - name: SQL 파라미터 은폐 검사
        if: ${{ !cancelled() }}
        working-directory: backend-service
        run: uv run python tests/test_sql_parameter_hiding.py

      - name: doc-search AsyncEngine 파라미터 은폐 검사
        if: ${{ !cancelled() }}
        working-directory: doc-search-mcp-service
        run: uv run python tests/test_workspace_engine_hides_parameters.py

      # 필터 파서 conformance (#295 #306) — Python↔TypeScript 두 벌이 같은 공유 입력 세트
      # (scripts/fixtures/filter_conformance_cases.json)에서 같은 방향으로 반응하는지. 그
      # fixture 가 backend-service/**·frontend/** 어느 글롭에도 안 들어가(scripts/ 밑) 서비스
      # 단위 on.paths 로는 못 덮는다 — 무경로필터 전수 실행이 딱 맞는 자리다.
      # 산출물 모양이 언어마다 달라(SQL 문자열 vs Prisma where 객체) 문자 그대로 비교할 수
      # 없으므로, fixture 가 못박은 행동 분류(reject|false|accept)를 제3의 기준으로 쓴다.
      # JS 쪽은 devextreme 패키지를 안 쓴다(filters.ts 의 외부 import 가 0) — npm ci 불요.

      - name: 필터 파서 conformance (Python)
        if: ${{ !cancelled() }}
        working-directory: backend-service
        run: uv run python tests/test_filter_conformance.py

      - name: 필터 파서 conformance (TypeScript)
        if: ${{ !cancelled() }}
        run: node scripts/verify_filter_conformance.mjs
  # ⚠ **이 잡만 따로 남는다.** 위 셋과 달리 `test: ` 잡이 아니고 `pull-requests: write` 로
  # 코멘트를 쓴다. 합치면 ㉠ 코멘트 게시 실패가 required 테스트 잡을 빨갛게 만들고
  # ㉡ 테스트 잡이 쓰기 토큰을 쥐게 된다. 둘 다 이 잡의 fail-open 설계와 정면으로 어긋난다.
  # ── 문서 전용 PR 「독립 리뷰 없음」 고지 (#23 Task 8, 2026-08-10 리드 결정) ──────
  # cross-review 는 paths-ignore(**.md·docs/**)로 문서 전용 PR 을 안 본다 — 판정 코멘트도
  # 네이티브 리뷰 기록도 없이 required 만 초록이 되어, 「리뷰 통과」와 「안 봄」이 체크로
  # 구분되지 않는다. 구 review-gate.yml 의 문서 전용 라우팅(human: merge)이 만들던 구분을
  # 라벨 없이 잇는다: 문서 전용이면 「독립 리뷰 없음」 코멘트를 남기고, 이후 push 로 코드가
  # 섞이면 그 고지를 낡음으로 고쳐 쓴다. 판정부는 scripts/review_notice.py 순수 함수다.
  #
  # 코멘트가 신호인 이유 — 초록 체크는 「통과」로 읽히고, 빨간 체크는 Orca 머지 버튼을
  # 잠근다(scripts/verify_upstream_gate.py 머리의 「Orca 판정 규칙」). 둘 다 목적에 안 맞는다.
  # `test: ` 접두 금지 — 게이트가 그 접두를 전수 판정하므로 사람 머지를 막게 된다.
  #
  # 이 잡은 빨갛게 끝나지 않는다 (fail-open) — 사람의 오독을 막는 보조 그물이 자기 인프라
  # 오류(API 실패)로 문서 PR 머지를 잠그면 안 된다. 실패는 ::error:: 로 남긴다.
  # 판정 자체는 fail-closed 다 — 파일 목록을 못 읽으면 고지하지 않는다 (리뷰가 돈 PR 에
  # 「리뷰 없음」을 잘못 붙이는 방향이 더 나쁘다).
  docs-notice:
    name: "chore: docs-notice (비게이트)"
    # 초안에서는 안 돈다 — 테스트 잡과 같은 가드다. 초안 PR 은 아직 리뷰를 받을 상태가
    # 아니므로 「독립 리뷰 없음」 고지도 이르다. 이 가드가 없으면 draft 구간의 push 마다
    # (`synchronize` 는 draft 에도 뜬다) 이 잡이 깨어난다.
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    # 테스트 잡과 같은 규칙 — 이 잡은 매 PR 마다 돌고 잡 하나 = 1분 올림 청구라, hosted 로
    # 남기면 통합 뒤 **남은 최대 과금**이 된다 (월 36 PR-push 기준 약 1,080분).
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 문서 전용 판정 → 「독립 리뷰 없음」 코멘트
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          set +e
          FILES=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename' \
            | jq -R -s 'split("\n") | map(select(length > 0))') || FILES=""
          DECISION=$(jq -n --argjson files "${FILES:-null}" '{files: $files}' \
            | python3 scripts/review_notice.py)
          if [ -z "$DECISION" ]; then
            echo "::error::판정부가 출력을 내지 못했다 — 고지 없음 (비게이트라 잡은 0 으로 끝난다)"
            exit 0
          fi
          echo "판정: $DECISION"
          if [ -n "$(jq -r '.error // empty' <<<"$DECISION")" ]; then
            echo "::error::$(jq -r .error <<<"$DECISION")"
            exit 0
          fi
          DOCS_ONLY=$(jq -r .docs_only <<<"$DECISION")

          # 자기 고지 코멘트 조회 — 마커 + github-actions[bot] 저자 동시 일치만 자기 것으로
          # 센다. 마커만 보면 제3자가 같은 문자열로 고지를 억제할 수 있다 (공개 레포).
          MARKER='<!-- docs-review-notice v1 -->'
          # --paginate + --jq 는 페이지마다 필터를 적용한다 — 첫 일치 한 줄만 취한다
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARKER\"))) | .id][0] // empty" \
            | head -n1)

          if [ "$DOCS_ONLY" = "true" ]; then
            if [ -n "$EXISTING" ]; then
              echo "문서 전용 — 고지 이미 있음 (comment $EXISTING), 무행동"
              exit 0
            fi
            BODY=$(printf '%s\n%s' "$MARKER" '**독립 리뷰 없음 — 문서 전용 PR.** 변경이 문서(`**.md`·`docs/**`)뿐이라 cross-review 가 돌지 않는다. 판정 코멘트도 네이티브 리뷰 기록도 생기지 않으므로, 체크가 전부 초록이어도 그것은 「리뷰 통과」가 아니라 「리뷰 없음」이다 — 사람이 읽는 것이 리뷰다.')
            gh pr comment "$PR" --repo "$REPO" --body "$BODY" \
              && echo "문서 전용 — 「독립 리뷰 없음」 고지 게시" \
              || echo "::error::고지 게시 실패 — 문서 전용 PR 이 표식 없이 흐른다. 재실행하거나 사람이 확인하라."
          else
            if [ -n "$EXISTING" ]; then
              # 문서 전용으로 열렸다가 코드가 섞인 PR — 낡은 고지를 그대로 두면
              # 정상 리뷰가 도는 PR 을 「리뷰 없음」으로 오독하게 한다.
              BODY=$(printf '%s\n%s' "$MARKER" '~~독립 리뷰 없음 — 문서 전용 PR.~~ 이후 push 로 코드가 섞여 정상 리뷰 경로가 적용된다 — 이 고지는 낡았다.')
              jq -n --arg b "$BODY" '{body: $b}' \
                | gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" --input - >/dev/null \
                && echo "코드 섞임 — 낡은 고지를 고쳐 씀 (comment $EXISTING)" \
                || echo "::error::낡은 고지 정정 실패 (comment $EXISTING) — 리뷰가 도는 PR 에 「리뷰 없음」 고지가 남아 있다"
            else
              echo "코드 변경 포함 — 정상 리뷰 경로, 무행동 (비문서: $(jq -c .nondoc <<<"$DECISION"))"
            fi
          fi
          exit 0
