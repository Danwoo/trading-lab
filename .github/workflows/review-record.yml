# review-record — 판정 코멘트를 GitHub 네이티브 PR 리뷰로 옮겨 적는 기록기 (#23 Task 7)
#
# 무엇: 리뷰어(Orca 워커 또는 사람)가 남긴 판정 코멘트의 기계 마커
#   (`<!-- cross-review v1 model=… [tier=…] verdict=… sha=… -->`)를 읽어 `github-actions[bot]` 명의의
#   네이티브 리뷰로 대행한다 — merge_ok → Approve, needs_changes → Request changes.
#   이어서 자동 머지 arm 조건(설계 §4)을 판정해 arm 하고, push(synchronize)가 오면 disarm 한다.
#
# 왜 봇 명의 대행인가: GitHub 이 자기 PR 자기 승인을 금지해, Orca 리뷰어가 쓰는 로컬 `gh`
#   (리드 계정)로는 자기 PR 승인이 서지 않는다. 그래서 리뷰어는 코멘트만 남기고 기록기가
#   GITHUB_TOKEN 으로 리뷰를 게시한다. 기록기는 파이프라인이 아니다 — 코멘트를 리뷰로 옮겨
#   적는 것뿐이라 결정론적이다 (판정부는 scripts/review_record.py 순수 함수 — 로컬에서 돈다).
#
# 보안 경계 (공개 레포 — 판정부가 지키고 test_review_record.py 가 공격 케이스로 못박는다):
#   · 저자 필터: OWNER·MEMBER·COLLABORATOR 코멘트, 그리고 이 레포 워크플로 자신의 게시분
#     (`github-actions[bot]` — 로그인·봇 타입 둘 다 일치)의 마커만 읽는다. 승인을 required 로
#     걸지 않는 이 설계에서 유일한 위조 방어다 — head sha 는 공개 정보라 필터가 없으면 누구든
#     위조 마커로 봇 승인·자동 머지를 일으킨다
#   · sha 는 40자 동등 비교 (접두사 매치 금지)
#   · `source=manual` 마커는 기록만 되고 arm 하지 않는다 (#285 규약)
#   · 봇 PR 은 제목의 상승 종류를 못 읽으면 arm 하지 않는다 (fail-closed)
#
# 자동 머지 arm 은 전부 참일 때만: ① required 게이트(`test: gate`) 초록 — 완료까지 재조회,
#   상한 초과는 실패로 접는다 ② 봇 승인 리뷰의 commit_id == 현재 head ③ 리뷰어 벤더 ≠ 저자
#   벤더, 또는 같은 벤더이면서 **작성 티어와 리뷰어 티어를 둘 다 알고 서로 다르다**
#   (cross-review 의 동일-벤더 자기리뷰 차단 승계 — 신원을 못 읽으면 arm 하지 않는다. 어휘 밖
#   에이전트형 신원은 사람 저자가 아니라 판독 불가로 접고, 티어 판독은 claude 신원에만 있다.
#   리뷰어 티어는 마커의 `tier=` 로 오는데 그 값은 리뷰어의 자기 보고가 아니라 cross-review 가
#   기동 배너에서 읽은 관측값이다 — #23 Task 9) ④ risk: low 또는 저자가 봇이면서 major
#   상승이 아니다.
#   위험도의 SoT 는 이슈의 risk 라벨(fresh 조회)이고, 이슈 연결은 PR 본문 파싱으로 읽는다 —
#   `Refs #N` 도 위험도 출처다 (2026-08-09 리드 결정. closingIssuesReferences 는 closing
#   키워드만 잡아, 그것만 보면 위험도를 읽히려고 PR 마다 전용 이슈를 만들게 된다).
#   **`Refs #N` 의 N 은 PR 일 수 있다** — `issues/{N}` 은 PR 에도 응답하고 PR 의 risk 라벨은
#   가시화 미러라 판정 입력이 아니다. PR 은 배제하고 배제한 번호를 로그에 남긴다.
#
# disarm 경로 (synchronize): arm 조건만 두면 「승인 → arm → push → 아무도 안 본 커밋이 머지」가
#   뚫린다 (설계 §4). GitHub 은 쓰기 권한 없는 사람의 push 에만 auto-merge 를 해제하는데 우리
#   워커는 권한자다 — 그래서 push 마다 여기서 푼다. 재arm 은 새 head 의 판정 코멘트가 다시
#   이 워크플로를 깨울 때 일어난다.
#
# 트리거 주의: 판정 코멘트가 GITHUB_TOKEN 발이면(예: cross-review publish 잡의 폴백 게시)
#   GitHub 재귀 방지로 issue_comment 이벤트가 안 뜬다. 주 경로(Orca 리뷰어의 로컬 gh 게시,
#   사람 코멘트)는 전부 사용자 발이라 문제없고, 폴백 게시분은 workflow_dispatch 로 PR 번호를
#   주면 같은 판정을 다시 읽는다 (복구 경로 — 판정은 코멘트 전수 재조회라 멱등이다).
#   그 복구 경로가 서려면 저자 필터가 봇 게시분을 읽어야 한다 — 위 「보안 경계」의 봇 축이
#   그것이고, 없으면 폴백 판정은 이벤트가 아니라 판독에서 유실된다.
#
# 전제 (레포 설정): ① allow_auto_merge 켜짐 (2026-08-09 실측 true) ② Settings → Actions →
#   General → "Allow GitHub Actions to create and approve pull requests" 켜짐 — 꺼져 있으면
#   승인 게시가 403 (GitHub Actions is not permitted to approve pull requests) 으로 죽는다.
#   킬 스위치: 레포 변수 AUTO_MERGE 가 'on' 이 아니면 arm 하지 않는다 (merge-router 승계).

name: review-record

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: "판정 코멘트를 다시 읽을 PR 번호"
        required: true

# record 와 disarm 을 PR 단위로 직렬화한다 — arm 판정 중에 push 가 오면 disarm 이 뒤에 돌아
# arm 을 푼다 (낡은 판정의 arm 은 record 쪽 head 대조가 막는다). 취소하지 않는다 —
# disarm 이 취소되면 뚫린 창이 그대로 남는다.
concurrency:
  group: review-record-${{ github.event.issue.number || github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: write        # 자동 머지 arm/disarm·직접 머지
  pull-requests: write   # 네이티브 리뷰·코멘트 게시
  checks: read           # required 게이트 체크런 조회
  issues: read           # 참조 이슈의 risk 라벨 조회

jobs:
  record:
    name: "review: record (비게이트)"
    # 마커 문법이 없는 코멘트는 러너를 띄우지 않는다. 위조 마커(비-멤버)는 여기를 통과해도
    # 판정부의 저자 필터가 막는다 — run 로그에 시도가 남는 것이 오히려 가시성이다.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'issue_comment' &&
           github.event.issue.pull_request &&
           contains(github.event.comment.body, '<!-- cross-review v1 ')) }}
    runs-on: ubuntu-latest
    # 게이트 대기 상한(1200초)보다 크게 — 러너가 먼저 잡을 죽이면 --final 판정이 로그에 안 남는다
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.issue.number || inputs.pr }}
      AUTO_MERGE: ${{ vars.AUTO_MERGE }}
      AUTO_MERGE_METHOD: ${{ vars.AUTO_MERGE_METHOD }}
    steps:
      # issue_comment·workflow_dispatch 는 기본 브랜치(main) 리비전에서 돈다 — 판정부 스크립트가
      # PR 코드가 아니라 main 에서 온다 (신뢰 경계: PR 코드는 체크아웃도 실행도 하지 않는다)
      - name: Checkout
        uses: actions/checkout@v4

      - name: 판정 코멘트 → 네이티브 리뷰 게시 + 자동 머지 arm
        run: |
          # gh 실패를 직접 분류하므로 -e 를 끈다 (Actions 기본 셸은 `bash -e {0}` —
          # cross-review 「셸 플래그 함정」 실측. `set -uo pipefail` 은 켜진 -e 를 끄지 않는다)
          set -uo pipefail
          set +e

          # workflow_dispatch 입력이 섞이는 값 — 숫자 외에는 받지 않는다 (주입 방어)
          case "$PR" in
            ''|*[!0-9]*) echo "::error::PR 번호가 숫자가 아니다: ${PR@Q}"; exit 1 ;;
          esac

          # ── 0) PR 상태 — 닫힌 PR 은 무행동, 조회 실패는 기록기 이상이라 빨강 ──────────
          INFO=$(gh pr view "$PR" --repo "$REPO" --json state,headRefOid)
          if [ -z "$INFO" ]; then
            echo "::error::PR #${PR} 조회 실패 — 기록기가 판정을 시작하지 못했다"
            exit 1
          fi
          STATE=$(jq -r .state <<<"$INFO")
          HEAD=$(jq -r .headRefOid <<<"$INFO")
          if [ "$STATE" != "OPEN" ]; then
            echo "PR #${PR} 상태 ${STATE} — 무행동"
            exit 0
          fi

          # ── 1) 코멘트·리뷰 전수 수집 — 저자 필터·sha 대조는 판정부(순수 함수)가 건다 ──
          COMMENTS=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -s 'add // [] | map({body, author_association, html_url,
                                      user_login: .user.login, user_type: .user.type})')
          REVIEWS=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            | jq -s 'add // [] | map({user_login: .user.login, state, commit_id})')
          if [ -z "$COMMENTS" ] || [ -z "$REVIEWS" ]; then
            echo "::error::코멘트·리뷰 조회 실패 — 판정 입력이 비었다 (fail-closed 종료)"
            exit 1
          fi

          DECISION=$(jq -n --arg head "$HEAD" \
              --argjson comments "$COMMENTS" --argjson reviews "$REVIEWS" \
              '{head_sha: $head, comments: $comments, existing_reviews: $reviews}' \
            | python3 scripts/review_record.py record)
          echo "record 판정: $DECISION"
          POST=$(jq -r .post_review <<<"$DECISION")
          EVENT=$(jq -r '.review_event // empty' <<<"$DECISION")
          VERDICT=$(jq -r '.verdict // empty' <<<"$DECISION")
          MODEL=$(jq -r '.model // empty' <<<"$DECISION")
          MARKER_SHA=$(jq -r '.marker_sha // empty' <<<"$DECISION")
          COMMENT_URL=$(jq -r '.comment_url // empty' <<<"$DECISION")
          ARM_CANDIDATE=$(jq -r .arm_candidate <<<"$DECISION")

          # ── 2) 네이티브 리뷰 게시 — commit_id 를 마커 sha 로 고정한다 (게시와 head 이동이
          #      경합해도 리뷰가 판정 대상 커밋에 박힌다. arm 은 어차피 head 동등을 재검한다) ──
          if [ "$POST" = "true" ]; then
            TIER=$(jq -r '.tier // empty' <<<"$DECISION")
            BODY=$(printf '독립 리뷰 판정 대행 기록 — 판정 코멘트의 기계 마커를 네이티브 리뷰로 옮겨 적었다.\n\n- 마커: model=%s tier=%s verdict=%s sha=%s\n- 판정 코멘트: %s\n- 저자 필터: OWNER·MEMBER·COLLABORATOR 코멘트 + github-actions[bot] 게시분만 읽는다 (scripts/review_record.py)\n\n이 기록은 판정 코멘트의 대행이다 — **자동 머지 arm 조건은 별도로 판정한다**(게이트 초록·승인 head 일치·자기리뷰 차단·위험도). 승인 리뷰가 있어도 arm 되지 않을 수 있고, 그 사유는 이 PR 의 review-record 잡 로그에 남는다.' \
              "$MODEL" "${TIER:-미상}" "$VERDICT" "$MARKER_SHA" "${COMMENT_URL:-(URL 미상)}")
            if OUT=$(jq -n --arg c "$MARKER_SHA" --arg e "$EVENT" --arg b "$BODY" \
                  '{commit_id: $c, event: $e, body: $b}' \
                | gh api -X POST "repos/$REPO/pulls/$PR/reviews" --input - 2>&1); then
              echo "네이티브 리뷰 게시: ${EVENT} (commit_id=${MARKER_SHA})"
            else
              echo "::error::네이티브 리뷰 게시 실패 — ${OUT}"
              echo "::error::'not permitted to approve' 계열이면 레포 설정(Settings → Actions → General → Allow GitHub Actions to create and approve pull requests)이 꺼진 것이다 — 사람이 켜야 한다"
              exit 1
            fi
          else
            echo "리뷰 게시 없음 — $(jq -r .reason <<<"$DECISION")"
          fi

          # ── 3) 자동 머지 arm — 조건 ①②③④ 전부 참일 때만 ─────────────────────────────
          if [ "$ARM_CANDIDATE" != "true" ]; then
            echo "arm 후보 아님 — 종료"
            exit 0
          fi
          if [ "$AUTO_MERGE" != "on" ]; then
            echo "킬 스위치 AUTO_MERGE=${AUTO_MERGE:-미설정} — arm 생략 (끄기·켜기: gh variable set AUTO_MERGE)"
            exit 0
          fi

          # ① required 게이트 초록까지 재조회 — 판정 코멘트는 게이트보다 먼저 올 수 있다.
          #   상한을 넘기면 --final 로 미완을 실패로 접는다 (fail-closed — repo-scans.yml
          #   gate 잡과 같은 루프 계약)
          DEADLINE=$(( $(date +%s) + 1200 ))
          while :; do
            CHECKS=$(gh api "repos/$REPO/commits/$HEAD/check-runs?per_page=100" --paginate \
                     --jq '.check_runs[] | {id, name, status, conclusion}') || CHECKS=""
            NOW=$(date +%s)
            FINAL=""
            [ "$NOW" -ge "$DEADLINE" ] && FINAL="--final"
            GATE_OUT=$(printf '%s\n' "$CHECKS" | python3 scripts/review_record.py gate $FINAL)
            GATE_RC=$?
            if [ "$GATE_RC" -ne 2 ]; then
              printf '%s\n' "$GATE_OUT"
              break
            fi
            echo "게이트 대기 — $(printf '%s' "$GATE_OUT" | tail -1) (남은 한도 $(( DEADLINE - NOW ))초)"
            sleep 15
          done
          if [ "$GATE_RC" -ne 0 ]; then
            echo "required 게이트 비초록 — arm 하지 않는다 (fail-closed)"
            exit 0
          fi

          # ②③④ — 전부 fresh 조회로 판정한다 (게이트 대기 동안 push·라벨 변경이 있을 수 있다)
          FRESH=$(gh pr view "$PR" --repo "$REPO" --json headRefOid,title,body,author,headRefName)
          if [ -z "$FRESH" ]; then
            echo "::warning::arm 직전 PR 재조회 실패 — arm 하지 않는다 (fail-closed)"
            exit 0
          fi
          HEAD_NOW=$(jq -r .headRefOid <<<"$FRESH")
          REVIEWS_NOW=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            | jq -s 'add // [] | map({user_login: .user.login, state, commit_id})')

          # 판정 마커도 다시 읽는다 — 게이트 대기(최대 1200초) 중에 새 마커가 올 수 있고,
          # 조건 ③ 은 마커의 model 로 자기리뷰를 판정한다. 낡은 벤더로 판정하지 않게 한다
          COMMENTS_NOW=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            | jq -s 'add // [] | map({body, author_association, html_url,
                                      user_login: .user.login, user_type: .user.type})')
          DECISION_NOW=$(jq -n --arg head "$HEAD_NOW" --argjson comments "${COMMENTS_NOW:-[]}" \
              --argjson reviews "${REVIEWS_NOW:-[]}" \
              '{head_sha: $head, comments: $comments, existing_reviews: $reviews}' \
            | python3 scripts/review_record.py record)
          if [ -z "$DECISION_NOW" ]; then
            echo "::warning::arm 직전 마커 재판정 실패 — arm 하지 않는다 (fail-closed)"
            exit 0
          fi
          echo "arm 직전 마커 재판정: $DECISION_NOW"
          MODEL_NOW=$(jq -r '.model // empty' <<<"$DECISION_NOW")
          # 리뷰어 티어 — 마커의 `tier=`(어휘 대조를 통과한 것만). 없으면 빈 값 = 미상이고
          # 동일-벤더 리뷰면 조건 ③ 이 그것으로 arm 을 막는다 (#23 Task 9)
          TIER_NOW=$(jq -r '.tier // empty' <<<"$DECISION_NOW")
          MARKER_SHA_NOW=$(jq -r '.marker_sha // empty' <<<"$DECISION_NOW")
          VERDICT_NOW=$(jq -r '.verdict // empty' <<<"$DECISION_NOW")
          MANUAL_NOW=$(jq -r '.manual' <<<"$DECISION_NOW")

          # 위험도: PR 본문의 참조 이슈(Refs·Closes 류)를 fresh 조회한다. `issues/$N` 은 **PR 에도
          # 응답**하므로 `.pull_request` 로 PR 여부를 함께 읽어 판정부에 넘긴다 — PR 의 risk 라벨은
          # merge-router 가 붙인 가시화 미러라 판정 입력이 아니다. 조회 실패는 lookup_failed 로
          # 실어 미선언 = 사람 경로로 접힌다 (fail-closed. 빈 목록으로 흡수하면 실패가 low 에 묻힌다)
          # 산문 참조와 「코드·인용에서 버린 후보」를 한 번에 받는다 — 버린 후보는 위험도를
          # **올리는 쪽으로만** 쓴다(그냥 버리면 고위험 참조가 접히고 저위험만 남아 위험도가
          # 내려간다). 한 호출이라 한쪽만 실패해 조용히 빈 목록이 되는 경로가 없다
          SCAN=$(jq -r '.body // ""' <<<"$FRESH" | jq -Rs '{body: .}' \
            | python3 scripts/review_record.py scan-refs)
          if [ -z "$SCAN" ]; then
            echo "::warning::참조 판독 실패 — arm 하지 않는다 (fail-closed)"
            exit 0
          fi
          DROPPED=$(jq -c .dropped <<<"$SCAN")
          REFS='[]'
          for N in $(jq -r '.refs[]' <<<"$SCAN"); do
            META=$(gh api "repos/$REPO/issues/$N" \
              --jq '{number, is_pr: (.pull_request != null), labels: [.labels[].name]}') \
              || META=""
            [ -n "$META" ] || META=$(jq -n --argjson n "$N" '{number: $n, lookup_failed: true}')
            REFS=$(jq --argjson m "$META" '. + [$m]' <<<"$REFS")
          done

          # 커밋 — 저자 신원(조건 ③)과 머지 커밋 본문 재현에 **같은 조회**를 쓴다. 신원 형식의
          # SoT 는 review_route 이고, 조회 실패는 빈 목록이라 판정부가 arm 을 거부한다 (fail-closed)
          COMMITS=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | {message: .commit.message, author_name: .commit.author.name,
                        author_email: .commit.author.email, parents: (.parents | length)}' \
            | jq -s '.') || COMMITS=""
          EMAILS=$(jq -c '[.[].author_email | select(length > 0)]' <<<"${COMMITS:-[]}")

          ARM=$(jq -n --arg head "$HEAD_NOW" --arg marker "$MARKER_SHA_NOW" --arg model "$MODEL_NOW" \
              --arg tier "$TIER_NOW" \
              --arg verdict "$VERDICT_NOW" --argjson manual "${MANUAL_NOW:-true}" \
              --argjson fresh "$FRESH" --argjson reviews "${REVIEWS_NOW:-[]}" \
              --argjson refs "$REFS" --argjson dropped "${DROPPED:-[]}" \
              --argjson emails "${EMAILS:-[]}" \
              '{head_sha: $head, marker_sha: $marker, marker_model: $model,
                marker_tier: $tier,
                verdict: $verdict, manual: $manual,
                reviews: $reviews, pr_author_login: $fresh.author.login,
                pr_author_is_bot: ($fresh.author.is_bot // false),
                pr_title: $fresh.title, head_ref: $fresh.headRefName,
                issue_refs: $refs, dropped_refs: $dropped,
                commit_author_emails: $emails}' \
            | python3 scripts/review_record.py arm)
          echo "arm 판정: $ARM"
          if [ -z "$ARM" ]; then
            echo "::warning::arm 판정부가 출력을 내지 못했다 — arm 하지 않는다 (fail-closed)"
            exit 0
          fi
          echo "위험도 근거: $(jq -r .risk_evidence <<<"$ARM") · PR 이라 제외한 참조: $(jq -r '.excluded_pr_refs | if length == 0 then "없음" else map("#\(.)") | join(",") end' <<<"$ARM")"
          if [ "$(jq -r .arm <<<"$ARM")" != "true" ]; then
            echo "arm 하지 않는다 — $(jq -r .reason <<<"$ARM")"
            exit 0
          fi

          # 머지 방식 화이트리스트: merge|squash 만 — rebase 는 단일 revert 앵커가 없어 제외
          # (merge-router 승계, 로컬 재현 2026-07-23)
          METHOD=merge
          case "${AUTO_MERGE_METHOD:-}" in
            merge|squash) METHOD="$AUTO_MERGE_METHOD" ;;
            rebase) echo "::warning::AUTO_MERGE_METHOD=rebase 는 화이트리스트 밖 — merge 로 강제" ;;
          esac

          # ── 머지 커밋 본문 — `작성 · 리뷰 · 머지` 한 줄을 남긴다 (#23 Task 9) ──────────
          # `--body-file` 은 GitHub 의 조립분(커밋 메시지 + Co-authored-by)을 **대체**하므로,
          # 그 조립을 재현한 뒤 한 줄을 더한다. 재현이 안 되면 **본문을 넘기지 않는다** —
          # 한 줄을 남기려고 열 개의 커밋 메시지와 저자 트레일러를 지우는 것이 더 나쁘다.
          BODY_JSON=$(jq -n --argjson commits "${COMMITS:-[]}" --argjson fresh "$FRESH" \
              --arg model "$MODEL_NOW" --arg tier "$TIER_NOW" \
              '{commits: $commits, head_ref: $fresh.headRefName,
                pr_author_is_bot: ($fresh.author.is_bot // false),
                reviewer_model: $model, reviewer_tier: $tier, merged_by: "auto"}' \
            | python3 scripts/merge_provenance.py body)
          MSG_ARGS=()
          if [ -n "$BODY_JSON" ] && [ "$(jq -r '.body | length' <<<"$BODY_JSON")" -gt 0 ]; then
            jq -r .body <<<"$BODY_JSON" > merge-body.txt
            MSG_ARGS=(--subject "$(jq -r .title <<<"$FRESH") (#${PR})" --body-file merge-body.txt)
            echo "provenance: $(jq -r .line <<<"$BODY_JSON")"
          else
            echo "::warning::머지 본문 재현 실패 — GitHub 기본 본문으로 머지한다 (provenance 줄 없음)"
          fi

          # arm 시도 → required 가 이미 전부 초록이라 PR 이 CLEAN 이면 GitHub 이 arm 을
          # 거부한다("clean status" — 기다릴 것이 없으면 arm 이 성립하지 않는다). 조건 ①②③④ 를
          # 이미 검증했으므로 직접 머지한다 (merge-router 의 검증된 폴백 승계).
          # `--match-head-commit` — 판정과 머지 사이에 push 가 끼면 GitHub 이 거부한다.
          if ARM_OUT=$(gh pr merge "$PR" --repo "$REPO" --auto --"$METHOD" \
                         --match-head-commit "$HEAD_NOW" "${MSG_ARGS[@]}" 2>&1); then
            echo "자동 머지 arm 완료 (방식: $METHOD · $(jq -r .reason <<<"$ARM"))"
          elif MERGE_OUT=$(gh pr merge "$PR" --repo "$REPO" --"$METHOD" \
                             --match-head-commit "$HEAD_NOW" "${MSG_ARGS[@]}" 2>&1); then
            echo "직접 머지 완료 (arm 거부: ${ARM_OUT})"
          else
            echo "::warning::arm·직접 머지 모두 실패 — arm: ${ARM_OUT} / 직접: ${MERGE_OUT}"
            gh pr comment "$PR" --repo "$REPO" --body "자동 머지 실패 — arm 도 직접 머지도 거부됐다. 사람이 확인하라. arm 오류: \`${ARM_OUT}\` · 직접 머지 오류: \`${MERGE_OUT}\`" \
              || echo "::warning::실패 코멘트 게시도 실패"
          fi
          exit 0

  disarm:
    name: "merge: disarm (비게이트)"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: push → 자동 머지 disarm (재승인 강제)
        run: |
          set -uo pipefail
          set +e
          gh pr merge "$PR" --repo "$REPO" --disable-auto 2>/dev/null \
            && echo "자동 머지 disarm (push — 새 head 는 판정 코멘트가 다시 와야 arm 된다)" \
            || echo "disarm 불요 (arm 상태 아님)"
          exit 0
