# plan — 계획 규약을 코멘트·라벨로 가시화한다 (plan-check + plan-label + plan-label-issue 통합)
#
# 한 규약(계획 코멘트 · `human: plan` 라벨)의 세 단면이라 한 파일에 담고, 잡을 이벤트로
# 가른다 — pull_request 가 plan-check·plan-reconcile 을, issue_comment 가 plan-label
# 부착·회수를 깨운다. 어느 잡도 머지를 막지 않는다 (게이트 결정은 사람의 것).
#
# 체크 이름은 통합 전과 byte-identical 로 유지한다 — 문서·사람이 그 이름으로 읽는다.
#
# 규약 (planner 스킬 산출물과 정합):
#   `## 계획` 코멘트 + `계획 승인: 필요` 선언  → `human: plan` 라벨 자동 부착 (레버 1)
#   `## 계획` 코멘트 + `계획 승인: 불요` 선언  → 라벨 미부착 + 안내 코멘트 (저위험 — 자동 진행)
#   `## 계획` 코멘트에 선언 라인이 아예 없음    → fail-safe 로 라벨 부착 (구 동작 보존)
#   소유자의 `승인` 으로 시작하는 코멘트        → 라벨 자동 제거 (승인이 GitHub 잔류물로 남는다)
#   PR 열림 (Closes 로 이슈 참조)              → 그 이슈의 `human: plan` 자동 회수 (레버 2 —
#                                                PR 의 존재 = 구현 시작 = 계획 국면 종료)
#   PR 열림 + 연결 이슈에 계획 코멘트 없음      → PR 에 경고 코멘트 (plan-check)
#
# 전제: 레포에 `human: plan` 라벨이 정의되어 있어야 한다.
# 배포: 이 파일을 대상 레포의 .github/workflows/ 에 복사한다.

name: plan

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  check-plan-comment:
    name: "chore: plan-check (비게이트)"
    # PR 이 열릴 때 연결 이슈(Closes #N)에 계획 코멘트(`## 계획` / `## 승인된 계획`)가
    # 하나도 없으면 PR 에 경고 코멘트를 단다. **머지를 막지 않는다** — 위반을 사람 눈에
    # 보이게만 한다. "계획 코멘트 없음"도 "조회 실패"도 코드가 틀렸다는 뜻이 아니므로
    # 이 잡은 **어떤 경우에도 0 으로 끝난다** (빨간 체크는 Orca 머지 버튼을 잠근다).
    # 문제는 코멘트와 ::error:: 주석으로 남는다.
    # 연결 이슈가 없는 PR 은 통과 — 사소한 변경 우회로(순차 한정)는 정상 경로다.
    # 기본 GITHUB_TOKEN 으로 충분 (레포 이슈 읽기 + PR 코멘트 쓰기 — PAT 불필요).
    if: ${{ github.event_name == 'pull_request' && github.event.action == 'opened' }}
    runs-on: ubuntu-latest
    permissions:
      issues: read
      pull-requests: write
    steps:
      - name: Warn if linked issues lack plan comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NODE: ${{ github.event.pull_request.node_id }}
          PR_NUM: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          set +e   # gh 실패를 직접 분류한다 (Actions 기본 셸은 `bash -e {0}`)
          ISSUES=$(gh api graphql -f query='query($id:ID!){ node(id:$id){ ... on PullRequest { closingIssuesReferences(first:10){ nodes { number } } } } }' -f id="$PR_NODE" --jq '.data.node.closingIssuesReferences.nodes[].number')
          if [ $? -ne 0 ]; then
            echo "::error::연결 이슈 조회 실패 — 계획 코멘트 점검을 건너뛴다 (게이트가 아니므로 머지는 막히지 않는다)"
            exit 0
          fi
          if [ -z "$ISSUES" ]; then echo "연결 이슈 없음 — 통과 (사소한 변경 우회로)"; exit 0; fi
          MISSING=""
          SKIPPED=""
          for N in $ISSUES; do
            CNT=$(gh api "repos/$REPO/issues/$N/comments" --paginate --jq '[.[] | select(.body | startswith("## 계획") or startswith("## 승인된 계획"))] | length' | paste -sd+ - | bc)
            if [ -z "$CNT" ]; then
              echo "::error::이슈 #$N 코멘트 조회 실패 — 계획 유무를 판정하지 못했다"
              SKIPPED="$SKIPPED #$N"
              continue
            fi
            if [ "${CNT:-0}" -eq 0 ]; then MISSING="$MISSING #$N"; fi
          done
          if [ -n "$SKIPPED" ]; then echo "::error::판정하지 못한 이슈:$SKIPPED — 아래 결론은 나머지 이슈에 대한 것이다"; fi
          if [ -z "$MISSING" ]; then
            echo "계획 코멘트 확인됨${SKIPPED:+ (단 판정 불가:$SKIPPED)}"
            exit 0
          fi
          # ⚠ `set +e` 라 스텝의 종료 코드는 **마지막 명령**의 것이다 — 코멘트 게시가 실패하면
          #   잡이 빨개진다. 명시적으로 0 으로 끝낸다 (비게이트 약속).
          gh pr comment "$PR_NUM" --repo "$REPO" --body "⚠️ **계획 코멘트 없음**:$MISSING — 연결 이슈에 \`## 계획\`(승인 대기) 또는 \`## 승인된 계획\`(사전 승인 기록) 코멘트가 없습니다. 계획은 위험 불문 이슈에 남깁니다(잔류물 원칙 — 맥락이 PR 에만 있으면 이슈 쪽 사슬이 끊깁니다). 사소한 변경 우회로였다면 이슈를 연결하지 않고 내는 것이 규약입니다." \
            || echo "::error::계획 코멘트 없음 경고를 PR 에 게시하지 못했다: $MISSING"
          exit 0

  reconcile-on-pr:
    name: "chore: plan-reconcile (비게이트)"
    # PR 이 Closes 로 이슈를 참조하며 열리면 그 이슈들의 human: plan 을 자동 회수한다.
    # **이 잡은 빨갛게 끝나지 않는다 (비게이트)** — 라벨 회수 실패는 「코드가 틀렸다」가
    # 아니라 GitHub API 사정인데, 빨간 체크는 Orca 머지 버튼을 잠근다. 실패는 ::error::
    # 주석으로 시끄럽게 남기되 잡은 0 으로 끝낸다.
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Reconcile plan-waiting on linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # 실패를 **삼키지 않고** 드러내되, 잡의 종료 코드로는 표현하지 않는다 (머리 주석).
          # 조용히 넘어가면 라벨이 안 붙은 채 초록이 되어 「초록으로 죽은 그물」이 되므로,
          # 회수 실패는 ::error:: 로 남긴다 — 사람이 Actions 요약에서 즉시 본다.
          set -uo pipefail
          set +e
          FAILED=0
          NAME="${REPO#*/}"
          # PR 이 닫는 이슈들 (closing 키워드 — Refs 는 안 잡힘, worker 규약이 Closes 필수)
          issues=$(gh api graphql -f query='
            query($o:String!,$n:String!,$pr:Int!){ repository(owner:$o,name:$n){
              pullRequest(number:$pr){ closingIssuesReferences(first:20){ nodes{ number } } } } }' \
            -f o="$OWNER" -f n="$NAME" -F pr="$PR" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].number' 2>/dev/null || true)
          [ -z "$issues" ] && { echo "닫는 이슈 없음 (Closes 미참조) — 무행동"; exit 0; }
          for N in $issues; do
            has=$(gh issue view "$N" --repo "$REPO" --json labels \
              --jq '[.labels[].name] | index("human: plan")' 2>/dev/null || echo null)
            if [ "$has" != "null" ] && [ -n "$has" ]; then
              # ⚠ `cmd && echo` 로 묶으면 -e 가 켜져 있어도 cmd 실패로 죽지 않는다 (AND-list 의
              #   마지막이 아닌 명령은 -e 면제 — 2026-07-29 실측). 여기서는 -e 를 껐으므로
              #   종료 코드를 직접 본다.
              gh issue edit "$N" --repo "$REPO" --remove-label "human: plan"
              if [ $? -ne 0 ]; then
                echo "::error::이슈 #$N 의 human: plan 회수 실패 — 계획 국면이 끝났는데 라벨이 남는다. 손으로 회수하거나 Actions 를 재실행하라."
                FAILED=1
              else
                echo "이슈 #$N: PR #$PR 열림 → human: plan 자동 회수 (계획 국면 종료)"
              fi
            else
              echo "이슈 #$N: human: plan 없음 — 무행동"
            fi
          done
          [ "$FAILED" -eq 1 ] && echo "::error::라벨 회수 실패가 있었다 (위 주석 참조). 잡은 게이트가 아니므로 0 으로 끝낸다."
          exit 0

  add-waiting-label:
    name: "chore: plan-label (부착)"
    # PR 코멘트가 아닌 이슈 코멘트 + `## 계획` 으로 시작할 때만. 부착 여부는 계획의
    # 자기 선언(`계획 승인: 필요|불요`, 레버 1)이 가른다 — 아래 스텝에서 분기한다.
    if: ${{ github.event_name == 'issue_comment' && !github.event.issue.pull_request && startsWith(github.event.comment.body, '## 계획') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add plan-waiting label unless plan self-declares low-risk
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body }}
        run: |
          # **-e 를 켠 채로 둔다 (의도)** — 이 스텝에는 폴백도 재시도도 없고, 라벨 부착·회수가
          # 실패하면 그대로 실패해야 한다. 조용히 넘어가면 라벨이 안 붙은 채 초록이 되어
          # 「초록으로 죽은 그물」이 된다. (cross-review 의 실패 분류 스텝만 -e 를 끈다 —
          #  거긴 실패를 분류해 다음 홉으로 보내야 하기 때문이다.)
          set -euo pipefail
          # planner 의 자기 선언(결정 17 레버 1)을 판독한다:
          #   "계획 승인: 필요" → 고위험(비가역·설계 갈림) → human: plan 부착 (사람 계획 게이트)
          #   "계획 승인: 불요" → 저위험(기존 틀 내)       → 미부착 + 안내 코멘트 (자동 진행)
          #   선언 라인 없음     → fail-safe 부착 (구 동작 보존 — 안전한 방향)
          # 파싱은 견고하게: 마크다운 강조(**·_·`) 제거 + 콜론형(: 또는 ：) 선언 라인만 판독.
          decl=$(printf '%s' "$BODY" \
            | sed 's/[*_`]//g' \
            | grep -m1 -E '계획 승인[[:space:]]*[:：]' || true)
          if printf '%s' "$decl" | grep -q '불요'; then
            echo "계획 승인: 불요 (저위험) — human: plan 미부착, 자동 진행"
            gh issue comment "$NUM" --repo "$REPO" \
              --body "저위험 — 계획 게이트 생략, 자동 진행합니다. 통제는 머지에서 이뤄집니다 (결정 17 레버 1)."
          elif printf '%s' "$decl" | grep -q '필요'; then
            echo "계획 승인: 필요 (고위험) — human: plan 부착"
            gh issue edit "$NUM" --repo "$REPO" --add-label "human: plan"
          else
            echo "계획 승인 선언 라인 없음/불명확 — fail-safe 로 human: plan 부착 (구 동작 보존)"
            gh issue edit "$NUM" --repo "$REPO" --add-label "human: plan"
          fi

  remove-on-approval:
    name: "chore: plan-label (회수)"
    # 레포 소유자의 `승인` 코멘트만 라벨을 뗀다 — 사람 게이트의 흔적이 GitHub 에 남는다
    if: ${{ github.event_name == 'issue_comment' && !github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '승인') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Remove plan-waiting label
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh issue edit "$NUM" --repo "$REPO" --remove-label "human: plan"
