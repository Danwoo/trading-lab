name: Frontend CI

# frontend 의 테스트·린트·타입체크·정적 그물을 돌린다.
#
# ── ci.yml 과 왜 파일을 나눴나 ────────────────────────────────────────────
# Actions 의 경로 필터는 잡별이 아니라 **워크플로별**이다. 이 잡을 ci.yml 에 넣으면 양방향으로
# 헛돈다: 프론트만 바꾼 PR 에 백엔드 계약 스위트가 전부 돌고, 백엔드만 바꾼 PR 에 npm ci 가
# 돈다. 워크플로를 나누는 것은 "변경 감지 잡 + 잡마다 if" 흉내와 다르다 — GitHub 가 제공하는
# 정식 수단이고 조용한 스킵(skipped 인데 초록)이 생기지 않는다.
#
# ── 잡을 둘로 묶었다 (2026-08-06) ────────────────────────────────────────
# 종전 8잡은 검사 하나당 잡 하나였고 npm ci 가 5중복이었다(잡당 40~70초). 이제 셋업 클래스로
# 묶는다: `test: frontend`(노드 + npm) · `test: frontend-db`(거기에 실 Postgres).
# 스텝은 전부 `if: ${{ !cancelled() }}` — 앞 검사가 실패해도 뒤 검사가 돈다(가림 없음).
#
# ⚠ **스텝 순서가 계약이다.** 단위 테스트(`npm test`)는 `prisma generate` **앞**에 둔다.
#   생성된 Prisma 클라이언트가 없는 상태에서 통과해야 "단위 테스트는 생성물에 의존하지
#   않는다"가 유지된다 (#337 — 그 의존이 섞였을 때 로컬은 초록, CI 는 ERR_MODULE_NOT_FOUND
#   로 빨강인 채 머지 대기열에 들어갔다). 실제 라우트 핸들러를 import 하는 회귀 테스트는
#   generate 뒤 스텝(test:api-regressions)이 맡는다. 순서를 바꾸면 그 경계가 사라진다.
#   (frontend/prisma/generated 는 .gitignore 대상이라 체크아웃 직후에는 실재하지 않는다 —
#    이 경계는 CI 에서 실제로 성립한다.)
#
# ── 경로 필터 ────────────────────────────────────────────────────────────
# `frontend/**` 가 빠지면 잡이 아예 안 돈다 — 그물이 걸려 있지 않은 상태(#241·#252 계열).
# 워크플로 파일이 바뀔 때도 돌린다 (#217).
# `scripts/verify_filter_negation.mjs` 는 레포 루트 scripts/ 아래라 `frontend/**` 밖이다.
# `scripts/fixtures/filter_conformance_cases.json` 은 그 스크립트가 #389 형식 오류 축을 읽는 곳.
# `backend-service/alembic/**` 은 frontend-db 잡이 public 스키마를 세우는 데 쓴다 (#363).
# `THIRD-PARTY-NOTICES.md`·`scripts/verify_notice_counts.py` 는 레포 루트다 (#365) — 고지 문서만
# 손대는 커밋에서 그 대조가 안 도는 구멍을 막는다. 문서가 서술하는 대상(프로덕션 의존성)이
# 바뀌는 축은 `frontend/**` 안의 package-lock.json 이 이미 덮는다.
# pull_request 에 branches(base) 제한을 안 두는 이유는 스택 PR (#281).
#
# ⚠ 아래 두 paths 목록은 같아야 한다 (Actions 는 YAML 앵커를 지원하지 않아 두 벌로 적는다).
on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/verify_filter_negation.mjs"
      - "scripts/fixtures/filter_conformance_cases.json"
      - "backend-service/alembic/**"
      - "THIRD-PARTY-NOTICES.md"
      - "scripts/verify_notice_counts.py"
      - "scripts/generate_notices.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "scripts/verify_filter_negation.mjs"
      - "scripts/fixtures/filter_conformance_cases.json"
      - "backend-service/alembic/**"
      - "THIRD-PARTY-NOTICES.md"
      - "scripts/verify_notice_counts.py"
      - "scripts/generate_notices.py"
      - ".github/workflows/**"

# 낡은 실행을 끊는다 (PR 한정). group 키 선택 근거는 ci.yml 의 같은 블록과 동일하다 —
# PR 은 번호로 갈라 서로를 취소하지 않게, main push 는 커밋 SHA 로 갈라 큐잉·취소 자체가
# 일어나지 않게 한다 (머지된 커밋의 검증 기록을 잃지 않는다).
concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 체크 이름은 ci.yml 과 같은 `test:` 접두사 규약.
  frontend:
    name: "test: frontend"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Intl/ICU 에 기대는 단정(formatDate 의 KST 변환)이 있어 개발 환경(v24)과 메이저를 맞춘다.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── 의존성 없이 도는 정적 그물 (소스 텍스트만 읽는다) ──────────────────
      # 전이 devextreme 의존 (#342 #341 #381) — anti-patterns 룰의 git grep 은 직접 import 만
      # 본다. 진입점이 shared 훅·배럴을 거쳐 전이로 무는 경우는 0 hit 로 빠져나간다.
      # #341 로 devextreme 이 앱에서 사라진 뒤 스코프는 **frontend 소스 전체**이고 허용 hit 은
      # 0건이다 — 진입점 0건·순회 리브니스 실패도 각각 빨간불이다.
      - name: 전이 devextreme 의존 검사
        if: ${{ !cancelled() }}
        run: node scripts/check-terminal-devextreme-transitive.js

      # 위 검사가 **무엇을 막는지**를 매번 주입으로 증명한다. exit 0 만으로는 "위반이 없다"와
      # "그 패키지를 애초에 안 본다"가 구분되지 않는다 — 실제로 걷어낸 6종 중 4종이 안 보이는
      # 채로 이 잡이 초록이었다(PR #417 독립 리뷰). 6종을 하나씩 주입해 6번 다 빨간불인지,
      # 허용 대상(MIT 포크)은 초록인지 확인하고, 검사 건수가 목록과 다르면 그것만으로 실패한다.
      - name: 재도입 그물 커버리지 — 6종 주입 시험
        if: ${{ !cancelled() }}
        run: bash scripts/injection-probe-devextreme.sh

      # app/api 라우트의 getKSTTime() 재유입 (#372) — #303 의 회귀 그물은 실제 라우트를
      # import 하지 않아 어느 라우트가 다시 써도 초록으로 남는 구멍이 있었다.
      - name: app/api 라우트 getKSTTime() 재유입 검사
        if: ${{ !cancelled() }}
        run: node scripts/check-no-kst-time-in-routes.js

      # --ignore-scripts: 루트 postinstall(prisma generate)과 엔진 다운로드를 건너뛴다.
      # install script 를 가진 devDependency 는 sharp 하나뿐이고(#361), 그 스크립트는
      # 프리빌트가 없을 때 소스 빌드로 넘어가는 폴백이다 — linux-x64 는 프리빌트 패키지
      # `@img/sharp-libvips-linux-x64` 가 바이너리를 그대로 싣고 오므로 스크립트 없이도 로드된다
      # (로컬 `npm ci` 가 스크립트를 안 돌린 상태에서 sharp.versions 를 읽어 확인).
      - name: Install dependencies
        if: ${{ !cancelled() }}
        run: npm ci --ignore-scripts

      # 브랜드 자산(logo.png·favicon.ico)이 커밋된 소스 SVG 에서 바이트 그대로 다시 나오는지
      # 본다 (#361 — "코드로 생성"이라 적혔지만 소스가 없어 재현 불가였던 자리). 대조 대상이
      # 0건이면 스크립트가 실패하고, 대조한 자산 수를 출력에 남긴다.
      - name: 브랜드 자산 재현 대조
        if: ${{ !cancelled() }}
        run: node scripts/generate-brand-assets.js --check

      # THIRD-PARTY-NOTICES.md 의 기계 소관 구간(개수·목록·§1 라이선스 원문)이 지금 lockfile
      # 에서 그대로 재현되는지 본다 — 브랜드 자산과 같은 형태(생성기 + `--check`)다. 의존성이
      # 바뀌면 `python3 scripts/generate_notices.py` 로 다시 만들어 커밋하면 된다(손으로 세지
      # 않는다). 아래 검사기를 대체하지 않는다: 이 스텝은 「생성기 출력 == 커밋된 문서」를,
      # 아래 스텝은 「문서를 다시 파싱한 결과 == 실측」을 본다.
      - name: THIRD-PARTY-NOTICES 재현 대조 (생성기 --check)
        if: ${{ !cancelled() }}
        working-directory: .
        run: python3 scripts/generate_notices.py --check

      # THIRD-PARTY-NOTICES.md 의 숫자·목록 ↔ 실측 (#365) — 위 생성기와 **독립된 판정**이다.
      # 생성기 출력을 믿지 않고 문서를 다시 파싱하므로, 생성기가 틀리면 여기서 갈린다
      # (생성기 버그를 생성기로 검증하면 두 스크립트가 같은 버그를 공유한다).
      # 문서 최상단의 재현 명령을 그대로 다시 돌려 **이름@버전 집합을 양방향으로** 대조한다
      # (개수만 맞추면 「하나 빠지고 하나 더 들어온」 상태가 통과한다).
      # node_modules 가 필요해 repo-scans 의 stdlib 잡이 아니라 여기 산다 — npm ci 뒤여야 한다.
      - name: THIRD-PARTY-NOTICES 숫자 대조 (fail-closed)
        if: ${{ !cancelled() }}
        working-directory: .
        run: python3 scripts/verify_notice_counts.py

      # ⚠ prisma generate **앞**에 둔다 (머리 주석의 순서 계약). 수집된 테스트가 0건이면
      # vitest 가 exit 1 한다 (vitest.config.ts 의 passWithNoTests: false) — 그 방어를 지우는
      # `--passWithNoTests` 는 붙이지 않는다. pretest 훅이 check-deps-sync.js 도 함께 돌린다.
      - name: Unit tests (Prisma 클라이언트 없이)
        if: ${{ !cancelled() }}
        run: npm test

      # DevExtreme 자신의 평가기를 심판으로 세워 filters.ts 의 where 변환이 같은 행 집합을
      # 내는지 대조한다 (#293) — devextreme 패키지를 frontend/node_modules 에서 그대로 읽고,
      # 스크립트는 레포 루트 기준 경로를 쓰므로 루트에서 실행한다.
      - name: 헤더필터 부정 회귀 검사
        if: ${{ !cancelled() }}
        working-directory: .
        run: node scripts/verify_filter_negation.mjs

      # package.json 의 "lint" 스크립트는 --fix 라 CI 에서 돌리면 위반을 조용히 고치고
      # 통과해버린다(게이트 무력화, #265). --fix 없이 직접 호출해 위반을 실패로 드러낸다.
      # eslint.config.mjs 는 parserOptions.project 를 안 써 타입 인지 린트가 아니다 —
      # Prisma 생성 클라이언트 없이도 정확하다.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npx eslint .

      # 드라이버 어댑터 기반 생성기라 엔진 바이너리 다운로드가 없다(실측 92ms, 네트워크 대기
      # 없음) — postinstall 전체 대신 이것만 돌린다.
      - name: Generate Prisma client
        if: ${{ !cancelled() }}
        run: npx prisma generate

      # 실제 라우트 핸들러를 withAuth 까지 포함해 그대로 import 하는 회귀 (#337) — 그 체인이
      # utils/common/api/responses.ts 를 거쳐 @/prisma/generated/client 를 문다. mock 으로
      # 바꾸면 "실제 핸들러를 호출해 검사한다"는 이 그물의 가치가 사라지므로 바꾸지 않는다.
      - name: API 라우트 회귀 테스트
        if: ${{ !cancelled() }}
        run: npm run test:api-regressions

      # API 라우트 다수가 Prisma 생성 타입을 참조하므로 generate 뒤에 둔다 (#265).
      - name: Type check
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

  # ── 격리 유지: deleteUserCascade 실제 삭제 경로 회귀 (#280 · #357 리뷰 [B]) ──
  # backend-service 의 verify_no_orphan_personal_workspaces.py(#280)는 감사 SQL 자신의
  # 정밀도·재현율만 보고 deleteUserCascade(TypeScript)는 호출하지 않는다 — 그 함수를 되돌려도
  # 그 검증은 초록으로 남는다. 여기서는 실제 Postgres 에 스키마를 세우고 deleteUserCascade 를
  # **직접 호출**해, 소유 워크스페이스에 메뉴·도메인 자식 행이 붙은 구성(관리 UI 로 도달 가능)
  # 에서도 탈퇴가 FK 위반 없이 끝나고 자식 행까지 지워지는지 본다.
  # 위 잡과 합치지 않는 이유: DB 파괴 여지가 있는 스크립트를 단위 테스트와 같은 컨테이너에
  # 얹지 않는다 (ci.yml 의 backend-db 와 같은 기준).
  #
  # **두 스키마를 다 세운다** (#363): 탈퇴 연쇄가 `public` 스키마(alembic 소유)의 워크스페이스
  # 데이터도 지우므로 frontend 스키마만 있는 DB 로는 그 축을 검사할 수 없다. 순서는 실제 배포와
  # 같다 — prisma(tables.sql) 먼저, alembic 나중(#333). `to_regclass` 류의 "있으면 지운다"
  # 가드를 두지 않았으므로, public 스키마가 없으면 조용히 통과하지 않고 빨강이 된다.
  frontend-db:
    name: "test: frontend-db"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=frontend
      NODE_ENV: development
      # authUtils.ts 가 물고 있는 lib/prisma/client.ts 는 env.ts(zod) 를 거친다 — DB 무관 값은
      # 이 잡에서 실제로 안 쓰이므로 형식만 채운다(빈 문자열은 필수 필드 검증에 걸린다).
      EMAIL_HOST: "smtp.example.com"
      EMAIL_PORT: "465"
      EMAIL_USER: "ci@example.com"
      EMAIL_PASSWORD: "ci"
      EMAIL_SECRET: "ci-secret-ci-secret-ci-secret-ci-secret"
      BETTER_AUTH_URL: "http://localhost:3010"
      BETTER_AUTH_SECRET: "ci-secret-ci-secret-ci-secret-ci-secret"
      JWT_SECRET: "ci-secret-ci-secret-ci-secret-ci-secret"
      BACKEND_SERVICE_URL: "http://localhost:8000"
      NEXT_PUBLIC_FILE_SERVICE_URL: "http://localhost:8000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      # tables.sql 은 DROP TABLE ... CASCADE 로 시작해 frontend 스키마를 매번 새로 만든다
      # (backend-db 잡의 verify_*.py 와 같은 패턴) — dbname=ci 는 이 잡 전용 컨테이너다.
      - name: Apply frontend schema (tables.sql)
        run: PGPASSWORD=ci psql -h localhost -U ci -d ci -v ON_ERROR_STOP=1 -f prisma/init/tables.sql

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # public 스키마(alembic 소유). frontend 스키마를 먼저 세웠으므로 0005·0006 은 실제
      # 배포와 같은 경로로 돈다.
      - name: Apply public schema (alembic)
        working-directory: backend-service/alembic
        env:
          ALEMBIC_DB_URL: postgresql+psycopg://ci:ci@localhost:5432/ci
        run: uv run python -m alembic upgrade head

      - name: deleteUserCascade 통합 테스트
        run: npm run test:db
