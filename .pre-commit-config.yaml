# `pre-commit install` 이 걸 훅 종류. pre-push 를 빼면 main 직접 push 방어(#420 P1)가
# 파일로만 존재하고 실제로는 안 돈다 — 이미 설치한 클론은 `pre-commit install` 을 다시 돌린다.
default_install_hook_types: [pre-commit, pre-push]
# 훅의 기본 스테이지는 **커밋뿐**이다. 이걸 안 적으면 pre-commit 3.x 기본값(모든 스테이지)이
# 걸려, push 할 때마다 eslint·tsc·vitest 가 통째로 한 번 더 돈다 (실측). push 에서 도는 것은
# `stages: [pre-push]` 를 스스로 적은 훅뿐이어야 한다.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # rev 는 서비스들이 잠근 ruff 와 같은 판으로 맞춘다 (2026-08-25 실측: multi-agent·backend
  # 0.16.4 · bot-agent 0.16.3). 종전 0.15.13 은 **훅이 서비스보다 낡은** 상태였고 그 차이를
  # 서비스 잡의 `ruff check app/` 가 메우고 있었다 — 그 중복 스텝을 없애면서 판을 맞춘다.
  # ⚠ `rev:` 는 `- repo:` **바로 다음 줄**이어야 한다 — scripts/verify_python_format.py 가
  #   그 앵커로 읽는다 (사이에 주석을 끼우면 「rev 를 못 읽었다」로 fail-closed 종료).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      # main 으로의 직접 push 를 막는다 (#420 P1). `no-commit-to-branch` 는 main **위 커밋**만
      # 막아서 `git push HEAD:main` 이 그대로 지나갔다. private 전환 뒤에는 서버 ruleset 이
      # 사라지므로(GitHub Free) 이 층이 그 자리를 일부 받는다. 우회는 `--no-verify` 뿐이다.
      - id: reject-push-to-main
        name: main 직접 push 거부
        language: system
        entry: python3 scripts/reject_push_to_main.py
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: eslint
        name: eslint
        language: system
        entry: bash -c 'cd frontend && if [ ! -d node_modules ]; then echo "SKIP eslint — frontend/node_modules 없음 (환경 미설치, 코드 문제 아님). cd frontend && npm ci 후 다시 커밋하세요."; exit 0; fi && for f in "$@"; do set -- "$@" "${f#frontend/}"; shift; done && npx eslint --fix "$@"' bash
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        exclude: ^frontend/prisma\.config\.ts$
        pass_filenames: true
        verbose: true

      - id: tsc
        name: tsc
        language: system
        entry: bash -c 'cd frontend && if [ ! -d node_modules ]; then echo "SKIP tsc — frontend/node_modules 없음 (환경 미설치, 코드 문제 아님). cd frontend && npm ci 후 다시 커밋하세요."; exit 0; fi && npx tsc --noEmit'
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        verbose: true

      - id: backend-claude-md
        name: backend CLAUDE.md 공통부 동일성 (전 backend 서비스 == backend-service)
        language: system
        entry: python3 scripts/verify_backend_claude_md.py
        files: ^[^/]+-service/CLAUDE\.md$
        pass_filenames: false

      - id: vitest
        name: vitest (frontend 순수 유틸)
        language: system
        entry: bash -c 'cd frontend && if [ ! -d node_modules ]; then echo "SKIP vitest — frontend/node_modules 없음 (환경 미설치, 코드 문제 아님). cd frontend && npm ci 후 다시 커밋하세요."; exit 0; fi && npm test'
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        verbose: true

      - id: mcp-lockstep
        name: mcp lockstep (mcp_tools·call_mcp_tool ↔ operation_id)
        language: system
        entry: python3 multi-agent-service/scripts/verify_mcp_lockstep.py
        # backend-service/app 갈래는 verify_mcp_lockstep.py 의 LITERAL_CALL_DIRS 와 같은 범위여야 한다
        # (call_mcp_tool 리터럴이 사는 곳). 한쪽만 옮기면 훅이 조용히 안 뜬다.
        # 체커 자신도 대상이다 — 검사 스크립트를 고치는 커밋에서 검사가 안 도는 것도 같은 구멍이다.
        files: ^(multi-agent-service/app/agents/domains/.*\.py|[^/]+-mcp-service/app/routers/.*\.py|backend-service/app/.*\.py|multi-agent-service/scripts/verify_mcp_lockstep\.py)$
        pass_filenames: false
