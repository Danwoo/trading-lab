repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: no-commit-to-branch

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: eslint
        name: eslint
        language: system
        entry: bash -c 'cd frontend && if [ ! -d node_modules ]; then echo "SKIP eslint — frontend/node_modules 없음 (환경 미설치, 코드 문제 아님). cd frontend && npm ci 후 다시 커밋하세요."; exit 0; fi && for f in "$@"; do set -- "$@" "${f#frontend/}"; shift; done && npx eslint --fix "$@"' bash
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        exclude: ^frontend/prisma\.config\.ts$
        pass_filenames: true
        verbose: true

      - id: tsc
        name: tsc
        language: system
        entry: bash -c 'cd frontend && if [ ! -d node_modules ]; then echo "SKIP tsc — frontend/node_modules 없음 (환경 미설치, 코드 문제 아님). cd frontend && npm ci 후 다시 커밋하세요."; exit 0; fi && npx tsc --noEmit'
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        verbose: true

      - id: backend-claude-md
        name: backend CLAUDE.md 공통부 동일성 (전 backend 서비스 == backend-service)
        language: system
        entry: python3 scripts/verify_backend_claude_md.py
        files: ^[^/]+-service/CLAUDE\.md$
        pass_filenames: false

      - id: vitest
        name: vitest (frontend 순수 유틸)
        language: system
        entry: bash -c 'cd frontend && if [ ! -d node_modules ]; then echo "SKIP vitest — frontend/node_modules 없음 (환경 미설치, 코드 문제 아님). cd frontend && npm ci 후 다시 커밋하세요."; exit 0; fi && npm test'
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
        verbose: true

      - id: mcp-lockstep
        name: mcp lockstep (mcp_tools·call_mcp_tool ↔ operation_id)
        language: system
        entry: python3 multi-agent-service/scripts/verify_mcp_lockstep.py
        # backend-service/app 갈래는 verify_mcp_lockstep.py 의 LITERAL_CALL_DIRS 와 같은 범위여야 한다
        # (call_mcp_tool 리터럴이 사는 곳). 한쪽만 옮기면 훅이 조용히 안 뜬다.
        # 체커 자신도 대상이다 — 검사 스크립트를 고치는 커밋에서 검사가 안 도는 것도 같은 구멍이다.
        files: ^(multi-agent-service/app/agents/domains/.*\.py|[^/]+-mcp-service/app/routers/.*\.py|backend-service/app/.*\.py|multi-agent-service/scripts/verify_mcp_lockstep\.py)$
        pass_filenames: false
