<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- #359 의 원본 SVG 는 커밋된 적이 없다. 이 파일은 그때 나온 favicon.ico 의 픽셀에서
       역산한 재구성이다 — 다만 산출물이 바이트 동일하게 다시 나온다 (#361).
       로고 배지를 32px 로 축소한 것이 아니라 32px 그리드에 맞춰 따로 그린 것이다 —
       막대 간격이 로고(56)와 다르다(5). 축소하면 1px 격자에서 간격이 뭉갠다. -->
  <defs>
    <linearGradient id="badge" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="32" y2="32">
      <stop offset="0" stop-color="#2E3BD0"/>
      <stop offset="1" stop-color="#2C64F8"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#badge)"/>
  <rect x="9" y="18" width="4" height="7" rx="1" fill="#fff"/>
  <rect x="14" y="12.5" width="4" height="12.5" rx="1" fill="#fff"/>
  <rect x="19" y="7" width="4" height="18" rx="1" fill="#fff"/>
</svg>
